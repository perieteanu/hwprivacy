[workspace]
members = [
    "hwprivacy-common",
    "hwprivacy-proto",
    "hwprivacy-daemon",
    "hwprivacy-ctl",
    "hwprivacy-tui",
    "hwprivacy-gui",
    "hwprivacy-lsm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["perieteanu"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zbus = { version = "4", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "signal", "time", "net", "io-util"] }
anyhow = "1"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }

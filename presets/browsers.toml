# Browsers.
#
# Browsers are the reason the kernel layer exists: they take the camera through
# V4L2 directly, so PipeWire never sees it. They are also where the executable
# is least like a principal — allowing a browser allows every website that ever
# talked you into a permanent per-origin grant. See DECISIONS
# d-executable-is-the-principal; this preset cannot change that and does not
# pretend to.
#
# Microphone is `ask_each` rather than `allow`: a browser is many tabs, and
# ask_each prompts per stream. Camera has no equivalent, because the kernel hook
# must answer in nanoseconds and cannot wait for a human.
#
# Only two candidates below were verified to exist on the machine this was
# written on. The rest are plausible paths for other distributions and are safe
# to list precisely because an unresolvable candidate is SKIPPED, never guessed
# at — the import will tell you what it tried.

name = "browsers"
description = "Firefox and Chrome — camera by executable inode, microphone per tab"

[[app]]
name = "firefox"
microphone = "ask_each"
camera = "allow"
monitor = "deny"
exe_candidates = [
  "/usr/lib/firefox-esr/firefox-esr",
  "/usr/lib/firefox/firefox",
  "/usr/lib64/firefox/firefox",
  "/opt/firefox/firefox",
]

[[app]]
name = "chrome"
microphone = "ask_each"
camera = "allow"
monitor = "deny"
exe_candidates = [
  "/opt/google/chrome/chrome",
  "/usr/lib/chromium/chromium",
  "/usr/lib64/chromium/chromium",
]

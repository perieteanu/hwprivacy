# What lives where, how data flows, who owns what.
# Verified against source + the live running daemon on 2026-08-19.
#
# HISTORY OF THIS FILE: it was written 2026-08-04 22:38 and described a
# 5-crate, PipeWire-only, zero-test project. That was accurate for eighteen
# minutes. The kernel pivot (DECISIONS.yaml > d-kernel-lsm-layer) was logged at
# 22:37 and the first kernel crate appeared at 22:55; this file was not
# reopened until 2026-08-19, by which point it omitted ~3000 LOC — an entire
# enforcement layer. Both layers are now described below.
---
shape:
  language: "Rust 2021 + one BPF C file"
  layout: "Cargo workspace, 7 crates, 15432 LOC of first-party code (BPF C included; generated vmlinux.h excluded)"
  build: "cargo build --release --workspace  (or: make build)"
  binaries: 5
  tests: 132        # 49 lsm + 62 daemon + 15 common + 6 proto. Zero in ctl/tui/gui.
  test_distribution_warning: >
    The 2026-08-21 tranches closed the worst of it: the dismiss path, one-shot
    grants, rule-name sanitising, policy staleness, and finally the layer-1
    security decision itself — classify_link() had none at all from 2026-03-27
    until 2026-08-21. What remains uncovered: parse_node()/parse_link() against
    real pw-dump JSON, and the three frontends.

two_layers:
  summary: >
    hwprivacy enforces in two places behind one policy engine. Neither layer is
    sufficient alone, and they are complementary rather than redundant.
  layer_1_pipewire:
    binary: "hwprivacy-daemon (user service)"
    sees: "which application wants the microphone; the playback monitor"
    blind_to: "the camera entirely — Firefox and Chrome use V4L2 directly and create no PipeWire node"
    mechanism: "poll pw-dump, diff link ids, destroy offending links"
    nature: "DESTRUCTIVE and RETROACTIVE — the link exists and carries data before it is torn down"
  layer_2_kernel:
    binary: "hwprivacy-lsm (root, systemd system service since 2026-08-20)"
    sees: "every open() of a video4linux (major 81) or ALSA (major 116) device node, keyed by executable inode"
    blind_to: "which app wants the mic — /dev/snd is held by /usr/bin/pipewire on behalf of everyone"
    mechanism: "eBPF LSM on security_file_open, returning -EPERM"
    nature: "PREVENTIVE — the open() never succeeds. But it hooks open(), not read(), so an ALREADY-OPEN fd cannot be revoked."
  why_both:
    - "Kernel closes the camera gap that makes layer 1 a placeholder for that device."
    - "PipeWire supplies app identity for the microphone, which the kernel cannot infer."
    - "The playback-monitor feature has NO kernel equivalent — there is no straightforward way to tap a sink monitor below PipeWire. This is why layer 1 is not legacy."
  ref: "DECISIONS.yaml > d-kernel-lsm-layer"

crates:
  hwprivacy-common:
    loc: 698
    purpose: "Shared types + the zbus client proxy. Every other crate depends on it."
    files:
      config.rs:         "Permission enum (5 levels), AppRule (incl. exe_path, which governs BOTH layers), Config, TOML load/save, normalize_app_name, kernel-allowlist derivation + gap reporting"
      device.rs:         "DeviceCategory (Microphone|Camera|Monitor), ProtectedDevice"
      stream.rs:         "StreamInfo, ActiveConnection, AccessEvent, AccessAction"
      dbus_interface.rs: "#[zbus::proxy] trait HwPrivacy — the client side of the API"
      preset.rs:         "importable rule sets: parsing, candidate-path resolution, and the import PLAN. Pure — the safety properties are testable without a filesystem."

  hwprivacy-daemon:
    loc: 2095
    purpose: "The only component that enforces anything. Everything else is a viewer."
    files:
      main.rs:            "CLI (run/install/uninstall/service-status), the monitoring loop, systemd+D-Bus unit installation"
      device_discovery.rs: "pw-dump JSON -> Vec<ProtectedDevice>. Classifies by media.class."
      pipewire_monitor.rs: "capture_graph() -> GraphSnapshot (nodes, ports, links); diff_links(); app identity resolution"
      policy_engine.rs:   "classify_link() (which side is the device, and WHICH instance of it), device_instance() (mic1..micN by sorted port name), evaluate() (rule -> PolicyDecision)"
      link_manager.rs:    "destroy_link() via pw-link --disconnect, fallback pw-cli destroy"
      stream_tracker.rs:  "active connections, 500-event ring buffer, one-shot grants, dismiss cooldowns"
      notification.rs:    "2-stage freedesktop notifications via notify-rust"
      dbus_service.rs:    "#[zbus::interface] server impl — 11 methods, 3 declared signals"
      state.rs:           "DaemonState = config + devices + tracker + known_link_ids + block_all"
      lsm_client.rs:      "layer 2 client — connects to the root helper's unix socket, reconnects every 10s, pushes the allowlist, RE-pushes it whenever PolicyFingerprint changes, receives kernel AccessEvents and folds them into the same tracker/notification path"
      history.rs:         "the persistent per-(identity, device, source) table behind `hwprivacy-ctl history` — denied AND allowed counts. Survives restarts; $XDG_STATE_HOME/hwprivacy/history.json, atomic writes, migrates from the pre-2026-08-21 offenders.json."
      notify_allow.rs:    "the pure gate deciding whether an ALLOWED access is announced: startup grace, per-(app,device) cooldown, never a burst summary."

  hwprivacy-ctl:
    loc: 230
    purpose: "CLI. status | devices | rules {list,set,remove} | streams | log | block-all | unblock-all"
    note: "Pure D-Bus client. Cannot function without the daemon."

  hwprivacy-tui:
    loc: 498
    purpose: "ratatui 4-panel view (Devices/Streams/Rules/Events). Polls D-Bus every 1s."
    keys: "Tab=cycle panel, Up/Down=select, r=refresh, q/Esc=quit; in Rules: a=allow d=deny e=ask_each w=while_in_use x=remove"

  hwprivacy-gui:
    loc: 598
    purpose: "GTK4 notebook (4 tabs) + ksni StatusNotifierItem tray. Polls D-Bus every 2s."
    files:
      main.rs:   "gtk::Application, tray thread + mpsc bridge, raw GLib log writer to suppress GTK 4.18 noise"
      window.rs: "tabs, add-rule form, Block All / Unblock All / Refresh, dbus_worker on its own tokio runtime"
      tray.rs:   "ksni tray: Show / Hide to Tray / Exit; left-click toggles window"
    note: "Close button hides to tray (connect_close_request returns Propagation::Stop). Ctrl+Q or tray Exit really quits."

  hwprivacy-proto:
    loc: 271
    tests: 6
    purpose: "The wire protocol between the root helper and the user daemon. serde + serde_json ONLY, deliberately — so the root process links no D-Bus stack."
    wire: "NDJSON, one JSON object per line. PROTO_VERSION = 1, checked before anything else is parsed."
    types:
      Request:  "tagged on `req` — hello, set_policy, get_policy, ..."
      Reply:    "tagged on `rep` — unknown message types are REJECTED, not silently ignored"
      PolicyEntry:    "(dev, ino) of an executable + a permission bitmask (PERM_CAMERA = 1<<0, PERM_AUDIO = 1<<1)"
      UnresolvedEntry: "a rule that wants the camera but whose exe_path does not resolve — reported back so the user can see the gap"
      AccessEvent:    "a kernel-side open() attempt, with verdict"
    note: "A burst summary is identified by pid 0, so it contributes to the count without firing a second notification."

  hwprivacy-lsm:
    loc: 2434
    tests: 44
    purpose: "The root helper. Owns the BPF maps and is the only writer to them."
    runs_as: >
      root, as hwprivacy-lsm.service (/usr/lib/systemd/system/), enabled and
      started at boot BEFORE the user daemon. Installed 2026-08-20; verified
      across two boots on 2026-08-21, NRestarts=0. Docs written before that date
      say it is started by hand — they are wrong.
    files:
      main.rs:         "CLI, BPF load/attach, the event loop, /proc enrichment, coalescing. BPF maps never leave the main thread."
      device_index.rs: "maps (major,minor) -> a human device name; owns glibc_to_kernel_dev()"
      policy.rs:       "the in-kernel allowlist, keyed by executable (dev, ino)"
      socket.rs:       "the unix-socket server — the helper's ONLY interface to the outside"
      event.rs:        "AccessEvent construction, coalescing, burst accounting"
      bpf/devices.bpf.c: "255 lines. The LSM program on security_file_open. Kept minimal — no loops, no unbounded reads — so the verifier accepts it."
    enforcement: "camera (major 81) is denied under --enforce; audio (major 116) is OBSERVE-ONLY and never denied here"
    why_audio_is_not_enforced: >
      Denying major 116 outright would deny /usr/bin/pipewire, which is every
      application's microphone path. The audio backstop (Phase 5, not started)
      needs a different shape: only the audio server may open capture devices.
    security_boundary: >
      The socket's MODE AND GROUP are the access control; the protocol grants
      nothing on its own. Directory 0755, socket 0660, group-owned by the
      desktop user. Anyone who can open /run/hwprivacy/lsm.sock can set camera
      policy.
    not_pinned: "The BPF program is never pinned. Killing the helper detaches it and restores normal access. Nothing is enforced at rest."

enforcement_pipeline_layer_1_pipewire:
  applies_to: "hwprivacy-daemon only. The kernel pipeline is described below."
  substrate: "polling — subprocess `pw-dump`, parsed as JSON"
  cadence: "policy.poll_interval_ms, default 500"
  measured_cost_2026_08_04:
    pw_dump_output: "272 KB of JSON per call"
    rate: "2 calls/sec => ~544 KB/s parsed continuously"
    cpu: "8m15s CPU over 11h05m uptime = 1.2% of one core, at idle"
    rss: "20.7 MB"
  steps:
    - "1. capture_graph(): pw-dump -> HashMap<node_id, NodeInfo> + Vec<PwLink>"
    - "2. diff_links(): links whose link_id is not in state.known_link_ids"
    - "3. classify_link(): is either endpoint a ProtectedDevice? which side is the app?"
    - "4. devices.is_guarded(category)? if not, skip entirely"
    - "5. block_all flag? destroy + log + next"
    - "6. evaluate(): one-shot grant, else config.get_permission(app, category) -> PolicyDecision"
    - "7. act: Allow=track it | Deny=destroy+notify | Ask/AskEach=destroy first, then prompt"
    - "8. reap: drop tracker entries whose link_id vanished from the graph"

  critical_property: >
    Enforcement is DESTRUCTIVE and RETROACTIVE, not preventive. The link is
    created by PipeWire, carries data, and is then torn down. Everything about
    the current design follows from that.

  critical_blind_spot: >
    The substrate can only observe what enters the PipeWire graph. A process
    that opens /dev/video0 (V4L2) or /dev/snd/pcmC0D0c (ALSA) directly creates
    no node and no link, and is therefore invisible — not 'allowed', not
    'missed', but structurally unobservable. Demonstrated 2026-08-04 for both
    camera and microphone. See ROADMAP.yaml > security_gaps > g5/g6.
    Any future work on this substrate inherits this blind spot; only a layer
    below PipeWire closes it.

enforcement_pipeline_layer_2_kernel:
  applies_to: "hwprivacy-lsm + hwprivacy-daemon/lsm_client.rs"
  substrate: "eBPF LSM program attached to security_file_open"
  measured_cost_2026_08_05:
    hook: "+13.75 ns per open(), 95% CI [+7.3, +20.2]"
    relative: "1.88% of a 733 ns open()"
    idle: "0% — nothing runs when nothing opens a device"
    contrast: "layer 1 burns ~1.2-1.5% of a core continuously, at idle, forever"
  steps:
    - "1. helper starts as root, loads the BPF object, attaches, binds /run/hwprivacy/lsm.sock (0660, group = desktop user)"
    - "2. daemon's lsm_client connects; on failure it retries every 10s, forever"
    - "2b. every policy.exe_recheck_secs the daemon fingerprints the intended allowlist — (exe_path, dev, ino) per entry plus the enforce flag — and re-pushes if it moved. Without this the kernel map went stale on a package upgrade (16h of silent non-enforcement, measured 2026-08-20) and rule changes from ctl/tui/gui never arrived at all. See DECISIONS d-policy-fingerprint."
    - "3. daemon derives the allowlist from config: only `allow` + a resolvable exe_path becomes a PolicyEntry (dev, ino)"
    - "4. rules that want the camera but whose exe_path does not resolve are returned as UnresolvedEntry and surfaced to the user"
    - "5. kernel: on open() of major 81/116, look up the calling executable's (dev, ino) in the allowlist"
    - "6. camera + not allowed + --enforce -> return -EPERM. audio -> observe only, never denied."
    - "7. helper coalesces a burst (a camera session is ~13 open() calls) into one event, and flushes the count separately"
    - "8. AccessEvent crosses the socket; the daemon folds it into the SAME tracker, event log and D-Bus surface, so ctl/tui/gui need no changes"
  identity: >
    (dev, ino) of the executable, not a self-declared name. This is strictly
    stronger than layer 1's identity, which an app asserts about itself.
    Consequence: /usr/bin/firefox is a shell script; the real binaries
    /usr/lib/firefox-esr/firefox-esr and ~/firefox-developer/firefox-bin are
    different inodes and therefore different policy keys. That is the feature.
  notification_path: >
    Kernel denials use an INFORMATIONAL notification with no action buttons.
    Originally because the action path carried b1 (dismiss wrote a permanent
    deny). b1 was fixed on 2026-08-21, so that reason has expired — but the
    buttons have NOT been added back, and adding them is a decision, not a
    cleanup: a kernel allow means writing an exe_path, which the prompt has no
    way to resolve from an event.
  critical_limitation: >
    Cannot revoke an ALREADY-OPEN fd. The hook fires on open(), not on read.
    Costin observed live camera video while enforcement was on, because Firefox
    had opened the device earlier and kept the descriptor. Same class as layer
    1's g1/g2. Closing it means hooking security_file_permission (intercepting
    every read) or revoking on policy change — a design step, not a patch.
  trap_that_bit_twice: >
    glibc's stat() dev_t and the kernel's dev_t are different bit layouts.
    Decoding one with the other's rules yields major 0 and silently matches
    NOTHING, while unit tests pass. It bit once for i_rdev and again for s_dev
    in the allowlist, where it looked exactly like 'enforcement works,
    allowlist does not'. All conversion now lives in
    device_index::glibc_to_kernel_dev().

app_identity_resolution:
  where: "pipewire_monitor.rs parse_node()"
  precedence:
    - "pipewire.access.portal.app_id  (sandboxed apps)"
    - "application.name / application.process.binary / node.description"
    - "basename of /proc/<pid>/exe"
    - "systemd unit / cgroup leaf from /proc/<pid>/cgroup"
    - "literal 'unknown'"
  annotation: >
    If a cgroup unit is known and not already in the label, it is appended as
    ' [unit]' — producing e.g. 'Firefox [pipewire-pulse]'.
  pid_resolution: "pipewire.sec.pid (server-attested) preferred over application.process.id; accepts JSON number or string"
  matching: >
    config.rs normalize_app_name() lowercases and strips ONE trailing ' [...]'
    annotation, but only when the string ends with ']'. So 'Firefox
    [pipewire-pulse]' -> 'firefox' and matches a rule named 'firefox'.
  trap: >
    Notification bodies render '{app} (pid:{n})'. A rule created by copying
    that whole string ends with ')', so nothing is stripped and the rule can
    NEVER match. THREE such dead rules exist in the live config (verified 2026-08-19).

device_classification:
  where: "device_discovery.rs classify_node()"
  rules:
    "Audio/Source":  "Microphone (unless node.name contains '.monitor' -> Monitor)"
    "Video/Source":  "Camera"
    "Audio/Sink":    "Monitor — registered so the sink->stream tap pattern can be caught"
  live_result_2026_08_04:
    - "monitor    alsa_output.pci-0000_00_1f.3.analog-stereo   Built-in Audio Analog Stereo"
    - "microphone alsa_input.pci-0000_00_1f.3.analog-stereo    Built-in Audio Analog Stereo"
    - "camera     v4l2_input.pci-0000_00_14.0-usb-0_7_1.0      Integrated Camera (V4L2)"
    - "monitor    alsa_output.pci-0000_01_00.1.hdmi-stereo     HDMI Digital Stereo"
  rescan: "every ~5s, but only for the first 120s after start (late hardware at autostart)"

dbus_api:
  service: "org.hwprivacy.Daemon"
  path: "/org/hwprivacy/Daemon"
  bus: "session"
  methods: 14
  method_list:
    - "GetDevices() -> a(sssb)              (category, node, description, guarded)"
    - "GetRules() -> a(sss)                 (app, device, permission)"
    - "SetRule(app, device, perm) -> b        (false if the name cannot become a rule key)"
    - "RemoveRule(app) -> b"
    - "GetActiveStreams() -> a(susssssb)    (app, pid, device, node, media, perm, active)"
    - "GetStatus() -> (buuuu)               (running, devices, rules, blocked, streams)"
    - "GetEvents(last_n) -> a(ssss)         (timestamp, app, device, action) — device carries the b3 instance, e.g. 'microphone (mic2)'"
    - "GetHistory() -> a(sssuuss)            (identity, device, source, denied, allowed, first, last) — was GetOffenders until 2026-08-21"
    - "GetPresets() -> a(ssus)                (name, description, entry_count, source_path)"
    - "ImportPreset(name, apply) -> a(ssb)    (app, outcome, was_added). apply=false plans and writes NOTHING."
    - "BlockAll() -> b"
    - "UnblockAll() -> b"
    - "AllowStream(node_id, app_name) -> b   (both: a node id alone is not an identity)"
    - "DenyStream(node_id) -> b"
  signals_declared: ["AccessAttempt", "RuleChanged", "StreamEvent"]
  signals_actually_emitted: ["RuleChanged"]
  consequence: >
    AccessAttempt and StreamEvent are dead declarations. TUI and GUI therefore
    POLL (1s / 2s) instead of subscribing. Any README claim that clients are
    signal-driven is false.

state_ownership:
  authoritative_config: "~/.config/hwprivacy/config.toml (system fallback: /etc/hwprivacy/config.toml)"
  written_by: "the daemon only — via Config::save(), whole-file rewrite with toml::to_string_pretty"
  written_when:
    - "SetRule / RemoveRule over D-Bus"
    - "a user choice on an action notification"
    - "on `hwprivacy-daemon install`, if no config exists yet"
  hazard: >
    Whole-file rewrite. Comments and hand-formatting in config.toml are
    destroyed on any rule change. Do not put explanatory comments there.
  in_memory_only:
    - "event ring buffer (500 entries, lost on restart)"
    - "blocked_count"
    - "one_shot_allowed grants"
    - "dismiss_cooldowns"
    - "block_all flag"

deployment:
  systemd_user_unit: "~/.config/systemd/user/hwprivacy.service  (generated by `hwprivacy-daemon install`)"
  dbus_activation:   "~/.local/share/dbus-1/services/org.hwprivacy.Daemon.service"
  live_2026_08_19: >
    hwprivacy.service active, MainPID 2134, NRestarts 0, running from
    ~/.local/bin/hwprivacy-daemon. It was moved out of target/release/ on
    2026-08-04 precisely because rebuilding replaced the binary underneath the
    running service. Four of the five binaries live in ~/.local/bin;
    hwprivacy-lsm does NOT — it is started by hand as root, per test.
    `make install` (which targets /usr/bin, needs sudo) has never been run and
    no .deb has ever been built.
  after_rebuild: "install -m 0755 target/release/hwprivacy-{daemon,ctl,tui,gui} ~/.local/bin/ && systemctl --user restart hwprivacy"
  kernel_helper_unit: >
      hwprivacy-lsm.service, enabled, at /usr/lib/systemd/system/. Binary in
      /usr/bin, not ~/.local/bin. Runs:
        hwprivacy-lsm --socket /run/hwprivacy/lsm.sock --socket-group hwprivacy
                      --policy-cache /var/lib/hwprivacy/policy --enforce --json
      Enforces from the cache before any user session exists. Still never
      pinned: stopping the service detaches the program and restores access.
  debian_dir: "complete (control, rules, changelog, copyright, compat, .service, .desktop, 4x .install) but never exercised"

external_dependencies:
  runtime_binaries: ["pw-dump", "pw-link", "pw-cli"]
  note: "Called as subprocesses. If PipeWire tooling is absent the daemon degrades to a no-op that logs warnings."
  kernel_layer_toolchain: "clang, libbpf-dev, libelf-dev, bpftool (in /usr/sbin, off a non-root PATH), vmlinux.h generated from /sys/kernel/btf/vmlinux. 'libelf.h: No such file' means the Phase 0 toolchain script has not run."
  kernel_requirements: "CONFIG_BPF_LSM=y, CONFIG_DEBUG_INFO_BTF=y, and `bpf` present in /sys/kernel/security/lsm. Satisfied on this machine (kernel 6.12) with no boot-parameter change."
  notable_crates:
    libbpf-rs: "layer 2. Chosen over Aya so the C stays minimal and the verifier stays happy."
    notify-rust: "=4.11.3 — hard-pinned for Debian 13 MSRV (rustc 1.85)"
    zbus: "4, tokio feature, default-features off"
    gtk4: "0.9"
    ksni: "0.2"
    ratatui: "0.28 + crossterm 0.28"

# Why this project exists.
# Read this first when reopening the repo after a long gap.
---
mission:
  primary: >
    Give the Linux desktop the hardware permission model Android has had for
    a decade: no native application touches the microphone, the camera, or the
    playback monitor without an explicit, remembered decision by the user.

  problem_statement: >
    Flatpak and Snap apps are gated by XDG Portals. Native .deb applications
    (Firefox, Telegram, Chromium, anything apt-installed) bypass all of it —
    any process running as your user can connect to PipeWire and take the mic,
    the camera, or record what is currently playing through the speakers, with
    no prompt, no indicator, and no log. There is no permission layer at all.

  approach: >
    Operate at the PipeWire graph level rather than per-application, so the
    control applies regardless of packaging format. PipeWire is the single
    chokepoint every audio and video device flows through on a modern Linux
    desktop; policing its links polices everything.

  distinguishing_feature: >
    Playback-monitor protection. Most privacy tooling thinks about mic and
    camera. This also blocks the eavesdrop case: an app tapping a sink's
    monitor source to record what YOU are listening to. Detected by link
    direction (Audio/Sink -> Stream/Input/Audio is a tap; the reverse is
    normal playback and is never touched).

posture:
  intended: "deny-by-default, explicit allowlist"
  as_shipped_2026_08_04: "ask-by-default (policy.default_action = ask)"
  note: >
    README has always said 'Default policy: deny all'. The live config says
    'ask'. This contradiction is unresolved and is the single most important
    thing to settle before further work — see DECISIONS.yaml d-posture-unsettled.

constraints:
  - "Target: Debian 13 (Trixie), PipeWire + WirePlumber, KDE Plasma and GNOME."
  - "No root. Daemon runs as a systemd *user* service, in the user's session."
  - "No hardcoded policy — everything lives in ~/.config/hwprivacy/config.toml."
  - "Idle cost must be negligible. 1.2% of a core (measured 2026-08-04) is NOT acceptable."
  - "Debian-packageable: MSRV pinned to what Debian 13 ships (rustc 1.85)."

explicit_non_goals:
  - "Defending against a hostile process running as the same user. See threat_model below."
  - "Replacing XDG Portals for sandboxed apps — this covers the native gap."
  - "Per-website visibility inside a browser. PipeWire cannot see it."
  - "A Qt/KDE-native frontend. GTK4 is accepted even on Plasma."

threat_model:
  scope_correction_2026_08_04: >
    MEASURED, not assumed. hwprivacy began as a PipeWire-graph observer, so it
    could only see applications that use PipeWire. Direct device-node access —
    V4L2 on /dev/video*, ALSA on /dev/snd/* — was completely invisible to it.
    Both were demonstrated on the live system; see
    ROADMAP.yaml > security_gaps > g5_camera_bypass and g6_alsa_bypass.
  scope_correction_superseded_2026_09_06: >
    Both bypasses are now closed IN THE KERNEL, and the sentence above is kept
    because it is the measurement that motivated the whole second layer. The
    camera has been enforced by executable inode since 2026-08-05; direct ALSA
    capture has been denied since 2026-09-06 (a non-allowlisted open() of
    /dev/snd/pcmC*D*c returns EPERM, verified live). What the kernel still
    CANNOT do is attribute a microphone open to an application — /dev/snd is
    held by the audio server on everyone\'s behalf — so per-application mic
    policy remains layer 1\'s job and inherits layer 1\'s weaknesses.
  defends_against:
    - "Silent monitor taps (recording your playback). Real and unique — PipeWire is genuinely the right layer for this."
    - "Careless PipeWire-routed microphone access, which is how most desktop apps take the mic."
    - "Direct ALSA microphone capture by a non-allowlisted binary — denied in the kernel since 2026-09-06. This was the project's largest hole for a month."
    - "Not knowing. The event log and notifications make PipeWire-path access visible."
  does_not_defend_against:
    - "A process running as your user: it can `systemctl --user stop hwprivacy`, and root can stop the kernel helper. The BPF program is never pinned, so stopping the helper restores normal access."
    - "Per-APPLICATION microphone policy against a determined process. The kernel now denies direct ALSA capture to any binary not on the allowlist (2026-09-06), but it cannot tell WHICH application is behind the audio server, so anything routed through PipeWire is gated by layer 1 and by name."
    - "An app that re-creates a PipeWire link faster than enforcement notices (~500 ms window)."
    - "Name spoofing at layer 1: `application.name` is what the app declares about itself. Layer 2 is not spoofable — it matches the executable's inode — but it speaks in binaries, not applications: for the microphone it can only say WHICH BINARY may bypass PipeWire, never which app is asking."
    - "An already-open fd. The LSM hook is on open(), not read: a camera opened before a deny took effect keeps working."
    - "Which WEBSITE asked. The executable is the principal, so allowing firefox allows every site that has a grant inside it."
  fixed_2026_08:
    - >
      Direct V4L2 camera access — how Firefox and Chrome actually take the
      camera — WAS the headline gap and is now enforced by the kernel layer,
      by executable inode. Measured: ffmpeg and a real browser both denied with
      EPERM, and allowed again on a grant. This entry is kept rather than
      deleted because every document in this repo asserted the opposite for a
      month, and 'the camera is not covered' is the single most likely thing a
      cold reader still believes.
  honest_framing: >
    'Guards the PipeWire path well, and the camera device node below it.' NOT
    'a hardware permission manager'. The microphone is still PipeWire-path
    only: /dev/snd is opened by /usr/bin/pipewire on everyone's behalf, so the
    kernel can see THAT the mic was opened but not by whom.
  what_fixed_it: >
    The eBPF LSM layer, built 2026-08-04 onward and running as a boot-time
    service since 2026-08-20. Attaches to lsm/file_open (enforcement) and
    lsm/file_release (release detection); both verifier-accepted on Debian 13,
    kernel 6.12. Measured cost: +13.75 ns per open(), 0% at idle.
    This section said 'what WOULD fix it', in the conditional, until
    2026-09-01 — five weeks after the layer shipped.

motivation_context:
  reopened: "2026-08-04"
  user_note: >
    Costin returned to the project not remembering it was feature-complete,
    and reported having tried to use it without success. Both are explained:
    it IS complete, and it misbehaved for four concrete reasons documented in
    ROADMAP.yaml > blockers. The docs were right about scope and wrong about
    behaviour.

# Format, vocabulary, and house rules specific to hwprivacy.
# Read before editing config handling, notifications, or anything that names an app.
---
permission_vocabulary:
  canonical_strings: ["allow", "ask_each", "while_in_use", "ask", "deny"]
  serde: "snake_case, both directions (Display + FromStr agree with the TOML encoding)"
  semantics:
    allow:        "every stream from this app is auto-allowed"
    ask_each:     "prompt for EVERY new stream — the browser-tab answer"
    while_in_use: "INTENDED: allowed while the app's PipeWire client lives. ACTUAL: identical to `allow` — nothing revokes."
    ask:          "prompt once, save a permanent rule"
    deny:         "always destroy the link, notify instantly"
  parse_rule: "case-insensitive on input, always lowercase on output"

device_vocabulary:
  canonical_strings: ["microphone", "camera", "monitor"]
  accepted_aliases: {microphone: "mic", camera: "cam", monitor: "mon"}
  monitor_means: >
    A playback sink's monitor source — i.e. recording what is coming OUT of
    your speakers. It does NOT mean a display/screen. The GUI add-rule field
    placeholder says 'camera/microphone/screen/...' which is wrong; 'screen'
    is not a valid category.

app_naming:
  identity_source: "PipeWire application.name, with fallbacks — see ARCHITECTURE.yaml > app_identity_resolution"
  rule_key: "config.rs normalize_app_name(): lowercase, strip ONE trailing ' [...]' iff the string ends with ']'"
  write_rules_as: "the bare lowercase app name — `firefox`, `obs`, `telegram-desktop`"
  never_write_rules_as:
    - "anything containing '(pid:NNNN)' — the pid is not stripped, the rule is dead on arrival"
    - "the full notification body text"
    - "an empty string"
  rationale: >
    Normalization is deliberately narrow. It exists to make the pulse-bridge
    variant 'OBS [pipewire-pulse]' match a rule written as 'obs'. It is not a
    general fuzzy matcher and will not save you from a pasted label.

config_file:
  path: "~/.config/hwprivacy/config.toml"
  owner: "the daemon"
  format: "TOML — [policy], [devices], and a [[rules]] array"
  rule_shape: "{app_name, microphone, camera, monitor, exe_path?} — every rule carries all three categories"
  default_for_unset_category: "deny  (serde default = default_deny)"
  policy_knobs:
    default_action: "deny since 2026-08-21 (d-deny-by-default). A config that OMITS the field now deserialises to deny, not ask."
    poll_interval_ms: "500. Raising it buys CPU by widening the race window — the wrong trade for a security tool."
    dismiss_cooldown_secs: "60. How long one (app, device) stays quiet after its prompt was dismissed."
    exe_recheck_secs: "30, 0 disables. How often the daemon re-stats the kernel allowlist's executables to notice a package upgrade changed an inode. See DECISIONS d-policy-fingerprint."
  rule_names_are_sanitised_on_write: >
    set_rule() runs config::sanitize_rule_name(), which strips a trailing
    "(pid:N)", normalises, and REFUSES anything that cannot become a key —
    empty, or a bare "[annotation]". It returns false rather than storing junk.
    The MATCHER (normalize_app_name) is deliberately untouched: it runs on every
    lookup and decides access, so widening it to repair a write-time mistake
    would make all future matching fuzzier.
  hand_editing:
    allowed: "yes, but stop the daemon first"
    warning: >
      Config::save() rewrites the whole file with toml::to_string_pretty.
      Comments and manual ordering are LOST on the next rule change. Never put
      documentation inside config.toml — put it here.
  no_hardcoding_rule: >
    Global house rule applies: any tunable belongs in config.toml, not in a
    Rust const. Current violations are listed in ROADMAP.yaml > debt.

notifications:
  stage_1: "instant 'BLOCKED: {app} -> {device}' — Urgency::Critical, Transient, 5s auto-dismiss, no actions"
  stage_2: "'Set rule for {app} -> {device}' — Resident, 60s timeout, action buttons"
  action_ids_permanent: ["allow", "ask_each", "while_in_use", "deny"]
  action_ids_per_stream: ["allow_stream", "deny_stream"]
  body_markup: "freedesktop HTML subset — <b>, <i>, <u> only"
  rule_key_line: >
    Every body that names an app also prints "Rule name: <key>" — the string
    that will actually match. The pid stays visible because it distinguishes two
    instances, but it is no longer the only thing there is to copy.
  allowed_access: >
    "X used the Camera" — Urgency::Normal, transient, no buttons. PAST TENSE
    always: the LSM hook is on open() and nothing fires on close, so hwprivacy
    does not know when access ends and must not imply it does. Gated by
    notify_allow.rs — see DECISIONS d-notify-on-allow for why the gate is a
    startup grace plus a cooldown rather than an allowlist of system daemons.
  prompts_never_expire: >
    Stage 2 uses Hint::Resident + Timeout::Never. A permission question is a
    to-do item; one that vanishes while you are away leaves the app silently
    broken. Only ONE prompt per (app, device) can be pending — a second stream
    is blocked and logged silently rather than stacking another identical
    popup. Decided 2026-08-23; see ROADMAP b6.
  dismiss_contract:
    contract: "block this attempt, save NO rule, stay quiet for policy.dismiss_cooldown_secs, ask again after it"
    when_it_applies: "only when the user ACTIVELY closes the popup. Prompts do not expire on their own, so this is no longer reachable by simply ignoring one."
    since: "2026-08-21 — see DECISIONS.yaml d-dismiss-saves-nothing"
    history: >
      Until then a dismissal wrote a permanent `deny` rule and the cooldown code
      was unreachable. The same expression also turned a FAILED notification —
      headless session, no notification daemon — into a permanent deny.
    three_outcomes: "notification::PromptOutcome is Chosen | Dismissed | Failed. Only Chosen may be persisted, and only notification::decide() decides that."

logging:
  framework: "tracing + tracing_subscriber::fmt, level from RUST_LOG (unit sets RUST_LOG=info)"
  read_with: "journalctl --user -u hwprivacy -f"
  event_ring_buffer: "500 entries, in memory, lost on restart. The PERSISTENT record is the offenders table (offenders.rs) plus the journal."
  event_timestamp: "chrono::Local, '%Y-%m-%d %H:%M:%S'. ISO order rather than the project's usual EU order because these lines get sorted and grepped as text. It was time-only until 2026-08-19 (gap g4)."
  event_device_column: "device_display() — 'microphone (mic2)' when the node presents several. Was the bare category, which made two different microphones indistinguishable in the log (half of b3)."

code_style:
  edition: "2021"
  msrv: "whatever Debian 13 ships (rustc 1.85). Do not adopt newer language features or bump pinned crates without checking."
  error_handling: "anyhow in binaries; the daemon never panics on PipeWire failure — it warns and continues"
  async: "tokio multi-thread; blocking notify-rust calls go through spawn_blocking"
  locking: "one Arc<RwLock<DaemonState>>. Drop the read guard before awaiting anything that needs the write guard."
  formatting: "cargo fmt defaults"
  lint: "cargo check is clean. clippy is NOT installed for this toolchain (`cargo clippy` -> no such command)."

testing:
  current: "132 tests — 15 common, 62 daemon, 49 lsm, 6 proto. Zero in ctl/tui/gui."
  still_uncovered:
    - "parse_node() / parse_link() / parse_port() against real pw-dump JSON. classify_link() is covered as of 2026-08-21, but from hand-built structs — the JSON parsing in front of it is not."
    - "the three frontends (ctl, tui, gui)."
  classify_link_covered_2026_08_21: >
    14 tests, built from node and port ids read out of this laptop's live graph.
    The one that matters most: ordinary playback INTO a sink must not be
    classified as a monitor tap. d-monitor-tap-by-link-direction rests entirely
    on that and nothing had ever checked it — a regression there would start
    tearing down music playback.
  house_rule_assert_on_state: >
    Never assert on log text or on process names. Four instruments failed on
    2026-08-19 while the product behaved correctly — a grep for a line --json
    suppresses, two pkill -f patterns matching the checking shell itself, and a
    test that killed the helper mid-push then deleted the log proving it. Assert
    on state: does the map hold the key, is the rule in the config, is the open
    denied.
  house_rule_prove_the_test_fails: >
    A test that passes against the bug it exists to catch is worthless. Every
    test added on 2026-08-21 was run against the deliberately reintroduced
    defect and observed to FAIL before being kept — the same discipline used for
    the b5 regression test.
  regression_sentinels: >
    tools/doc-check carries SENTINELS: source patterns that must never reappear,
    each one a defect that actually shipped. Add an entry only after a bug has
    occurred, never speculatively.

repo_hygiene:
  version_control: "git, since 2026-08-04. target/ is ignored. Docs predating that date claim otherwise and are wrong."
  size: "3.2 GB, almost entirely target/"
  log_md: "append-only, global format: DD-MM-YYYY HH:MM | DDD | hw | [TYPE] desc"
  short_name: "hw  (as registered in project-tracker projects.yaml)"

credit:
  rule: >
    Standing global preference: if this is published or treated as a portfolio
    item, add the discreet collaborator line to README Credits and keep the
    Co-Authored-By trailer. Costin is author of record.

test_subjects:
  browser: >
    Firefox-ESR (/usr/lib/firefox-esr/firefox-esr, inode 30287776) is THE test
    browser, agreed 2026-08-19. It is the binary config.toml allowlists.
  why_this_must_be_stated: >
    Two Firefox builds run on this machine and they are DIFFERENT POLICY KEYS:
    ~/firefox-developer/firefox-bin is inode 1312111 and appears in no rule.
    The kernel keys on the executable's inode, so 'allowlist Firefox' silently
    means 'allowlist one build of Firefox'. Testing in the wrong window
    produces a correct denial that reads as a bug. Check via Help > About, or
    about:support > Application Binary.
  automated_driver: >
    Headless Chrome opens the real /dev/video0 through V4L2 with
    --use-fake-ui-for-media-stream (real device; NOT --use-fake-device). Claude
    can drive it unattended, as a fresh process each time, so the retained-fd
    confound cannot occur. Used for accounting checks that need no human.
  not_yet_agreed: >
    Headless Firefox and other local software (VLC was raised) as additional
    subjects. DISCUSS BEFORE BUILDING — Costin asked explicitly not to start
    this unprompted.

multiple_devices_of_one_kind:
  rule: "mic1, mic2, mic3 … micN. cam1, cam2 … camN. UNLESS the device publishes its own name or identifier, in which case use that."
  decided: "2026-08-19, by Costin, after declining to determine which internal microphone is physically left."
  why_ordinals_and_not_left_right: >
    "Left" is a claim about the physical world. Which internal microphone maps
    to capture_FL depends on codec wiring and was NOT determined. A label that
    says "left microphone" and is wrong is worse than one that says nothing,
    because the user acts on it — and this project has spent two days cleaning
    up readouts that asserted things they had not established. "mic1" claims
    only that it is the first one, which is true by construction.
  the_constraint_that_makes_or_breaks_this: >
    The ordinal MUST be derived deterministically from something STABLE across
    reboots, or a rule saying "mic2 = deny" silently starts denying a different
    microphone. PipeWire port IDs are NOT stable — they are allocated per
    session. Port NAMES are: capture_FL and capture_FR persist. So sort by a
    stable key (port name) and assign ordinals in that order. Never assign by
    discovery order, arrival order, or port id.
  prefer_the_published_name: >
    A USB webcam or headset usually reports a product name. Use it. Ordinals
    are the fallback for indistinguishable devices on one physical adapter,
    not the default for everything.
  applies_to:
    - "notification text — the user must be able to tell two prompts apart  [DONE 2026-08-21]"
    - "the event log and hwprivacy-ctl log  [DONE 2026-08-21]"
    - "rules in config.toml  [NOT DONE — rules are still per CATEGORY; per-device rules stay deferred]"
    - "the offenders table, or two mics collapse into one row  [NOT DONE]"
    - "hwprivacy-ctl devices  [NOT DONE]"
  does_NOT_apply_to_the_monitor_category:
    rule: "A playback sink is never given an ordinal."
    why: >
      monitor_FL and monitor_FR are two CHANNELS of one playback device, not two
      devices. Labelling them would invent a second speaker pair. Their links
      are coalesced into a single prompt instead — the opposite treatment from
      the microphone, and deliberately so. See DECISIONS d-coalesce-by-category.
    the_test: >
      Not "do the two links look alike" — they do, in both cases. It is "can the
      user meaningfully answer differently for each". Two microphones: yes. Two
      channels of one speaker pair: no.
  implementation_2026_08_21:
    where: "policy_engine::device_instance()"
    sorted_by: "port NAME, ascending. Never port id, never discovery order."
    returns_none_when: "the node has fewer than two ports facing that direction, or the port cannot be resolved. A missing ordinal is honest; a wrong one is not."
    direction_matters: >
      Only ports facing the same way as the one used are counted. A sink has
      playback_* facing in and monitor_* facing out and they are not one
      population. NOTE: on this laptop "monitor" happens to sort before
      "playback", so a test built on this hardware passes even with the
      direction filter removed — the first version of that test did exactly
      that and proved nothing.
  worked_example_2026_08_19: >
    This laptop: one ALSA stereo capture device, two physical microphones,
    exposed by PipeWire as ports capture_FL and capture_FR. Sorted by name that
    is FL then FR, so FL = mic1 and FR = mic2 — with no claim about which one
    is on the left of the chassis.

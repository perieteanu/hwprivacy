# What's built, what's broken, what's next.
# Updated when work lands or priorities shift.
---
current_state:
  date: "2026-08-04"
  stage: "build"
  reality_check: >
    This project is FEATURE-COMPLETE and was mis-remembered as unfinished. All
    five planned phases exist in code, `cargo check --workspace` is clean, and
    the daemon has been running continuously as a systemd user service. What
    failed was not scope — it was four behavioural defects that made daily use
    unpredictable.

  verified_working:
    - "Cargo workspace, 7 crates, 7079 LOC, builds clean (8 trivial warnings, 0 errors) — verified 2026-08-19"
    - "Device auto-discovery — 4 devices found live (mic, camera, 2 sinks)"
    - "Monitor-tap detection by link direction (validated: parecord got 0 bytes)"
    - "Link destruction via pw-link --disconnect with pw-cli fallback"
    - "5 permission levels + per-stream gating for browsers"
    - "D-Bus service, 11 methods, session bus, activation file installed"
    - "hwprivacy-ctl — all 7 command groups functional against the live daemon"
    - "hwprivacy-tui — 4 panels, keyboard rule editing"
    - "hwprivacy-gui — GTK4 tabs, add/remove rules, ksni tray, close-to-tray"
    - "2-stage notifications (instant BLOCKED + action prompt)"
    - "`hwprivacy-daemon install/uninstall` — systemd user unit + D-Bus activation"
    - "Complete debian/ packaging tree"

  measured_live_2026_08_04:
    daemon_pid: 2331
    uptime: "11h05m"
    cpu: "8m15s = 1.2% of one core, at idle"
    rss: "20.7 MB"
    guarded_devices: 4
    active_rules: 8
    blocked_attempts: 26
    running_from: "target/release/ — the dev tree, NOT /usr/bin"

blockers:
  label: "Why it 'did not work properly'. Fix these before anything else."
  b1_dismiss_writes_deny:
    severity: critical
    what: "Dismissing a notification writes a permanent `deny` rule instead of doing nothing."
    where: "hwprivacy-daemon/src/notification.rs:196 — `perm.or(Some(Permission::Deny))`  (was :146 until notify_kernel_denial() was inserted above it; tools/doc-check now guards this coordinate)"
    effect: "The unreachable `None` arm in main.rs:382 means record_dismiss()/is_in_cooldown() are dead code. Config silently accumulated denials the user never chose."
    evidence: "journalctl 18:47:04 — 'dismissed — no rule saved' immediately followed by 'User set rule: ... = deny'"
    mode: execute
    est_minutes: 20

  b2_stale_oneshot_grants:
    severity: critical
    what: "`ask_each` streams get silently ALLOWED with no prompt."
    where: "hwprivacy-daemon/src/stream_tracker.rs:128 grant_one_shot()"
    effect: "one_shot_allowed: Vec<u32> is never pruned and is keyed on the PipeWire node id, which PipeWire recycles. An old grant leaks onto an unrelated later stream."
    evidence: "live event log — 'Firefox [pipewire-pulse] microphone ALLOWED' while config says microphone = ask_each"
    mode: execute
    est_minutes: 45

  b3_duplicate_prompts:
    severity: high
    what: "A stereo capture produces two identical BLOCKED popups and two rule prompts."
    where: "hwprivacy-daemon/src/main.rs — `for link in &new_links`, no grouping"
    effect: "Each channel is its own PipeWire link and is evaluated independently. Reads as broken."
    evidence: "event log shows exact pairs: 18:45:17 monitor DENIED x2, 18:45:19 x2, 18:45:22 x2"
    fix_shape: "coalesce new links by (app node, device category) within a poll before deciding/notifying"
    mode: execute
    est_minutes: 60

  b4_dead_rules_in_config:
    severity: medium
    what: "Three of the 8 live rules can never match anything."
    detail:
      - "app_name = '' — no stream is ever named empty (parse_node falls back to 'unknown')"
      - "app_name = 'Firefox [pipewire-pulse] (pid:2332)' — ends with ')', so normalize_app_name strips nothing"
      - "app_name = 'pipewire [pipewire-pulse]' — a self-reference artefact of the dismiss defect"
    root_cause: "notification bodies render '{app} (pid:{n})' and users paste that string into the rule form"
    fix_shape: "clean the config AND stop the trap — validate/normalize app_name on SetRule, and stop offering a pasteable pid-bearing label"
    mode: execute
    est_minutes: 30

security_gaps:
  label: "Real holes not listed in README > Known Limitations."
  g1_grandfathered_links:
    what: "Links that already exist when the daemon starts are never evaluated."
    where: "main.rs:158 seeds known_link_ids with every link from the initial capture, then only the diff is processed"
    effect: "A mic tap active before daemon start survives forever. Also means every daemon restart re-grandfathers everything."
    fixed_free_by: "d-event-driven-substrate (registry enumeration gives existing objects on connect)"

  g2_blockall_does_not_block:
    what: "The emergency Block All button does not stop anything already recording."
    where: "dbus_service.rs block_all() only sets state.block_all = true, which gates NEW links"
    effect: "Existing allowed links keep flowing. The button implies a panic-stop it does not deliver."
    note: "link_manager.rs:33 destroy_all_links_to_node() already exists and is never called — it is exactly the missing piece."

  g3_no_persistent_audit:
    what: "The event log is a 500-entry in-memory ring buffer, lost on every restart."
    effect: "No forensics. 'Did anything use my mic last Tuesday' is unanswerable."

  g4_timestamps_lack_a_date:
    what: "AccessEvent.timestamp is '%H:%M:%S' only."
    where: "stream_tracker.rs:65"
    effect: "Events are ambiguous past midnight; unusable if g3 is ever fixed."

  g5_camera_bypass:
    severity: "critical — the camera feature does not function against the real threat"
    discovered: "2026-08-04, by direct experiment on the live system"
    what: "Opening /dev/video0 directly via V4L2 is completely invisible to hwprivacy."
    why: >
      Firefox and Chrome acquire the camera through V4L2 directly, not through
      PipeWire. No PipeWire node is created, no link appears, so the link-diff
      monitoring substrate has nothing to observe.
    evidence: |
      ffmpeg -f v4l2 -i /dev/video0 -frames:v 90   (exit 0, 90 frames captured)
                      events  blocked  pw_links  cam_node_state  v4l2_fds_open
        before          64      26       10      suspended             0
        during (x5)     64      26       10      suspended             1
        after           64      26       10      suspended             0
      hwprivacy camera events logged: 0.  journal over the window: no entries.
      The PipeWire camera node (id=68, Video/Source) never left `suspended` —
      PipeWire was not involved at any point.
    fixable_in_pipewire_layer: false
    note: "No amount of polish, event-driven rework, or classification work reaches a process that never talks to PipeWire. Requires eBPF LSM, AppArmor, or device-node ACLs."
    also: "/dev/video1 exists alongside /dev/video0 (typically the UVC metadata node of the same device). Any device-node rule must cover the whole set."

  g6_alsa_bypass:
    severity: "high — microphone protection covers the common path, not the threat"
    discovered: "2026-08-04, same method"
    what: "Opening the mic directly via ALSA (hw:0,0 -> /dev/snd/pcmC0D0c) is equally invisible."
    evidence: |
      ffmpeg -f alsa -i hw:0,0 -t 3    (exit 0, 3s of real microphone audio captured)
                      events  blocked  pw_links  snd_pcm_fds_open
        before          64      26       10             1
        during (x5)     64      26       10             2
        after           64      26       10             1
      journal over the window: no entries.
    consequence: >
      The Phase-1 parecord validation proved that the PIPEWIRE PATH is guarded.
      It did not prove the microphone is guarded. Both statements were conflated.

  honest_coverage_2026_08_04:
    playback_monitor: "REAL and unique. There is no straightforward kernel-level way to tap a sink monitor, so PipeWire is genuinely the correct layer. This feature holds up."
    microphone: "PARTIAL. Blocks apps that route through PipeWire (most desktop apps). Misses anyone who calls ALSA directly."
    camera: "NONE in practice. Only sees the minority of apps that route camera through PipeWire's Video/Source."
    accurate_one_liner: "hwprivacy guards the PipeWire path, well. It is not a hardware permission manager."

  verification_harness:
    purpose: "Reusable acceptance test for any enforcement layer, present or future."
    method: >
      Snapshot (hwprivacy event count, blocked count, pw-dump link count, open
      fds on the device node) before / during / after a direct-access attempt.
      An enforcement layer that works must either make the open() fail or make
      the event count move.
    camera: "ffmpeg -hide_banner -f v4l2 -i /dev/video0 -frames:v 90 -f null -"
    microphone: "ffmpeg -hide_banner -f alsa -i hw:0,0 -t 3 -f null -"
    pass_criterion_for_kernel_layer: "both commands must fail with EPERM for a denied app"
    caution: "the camera test lights the webcam LED; the mic test records real audio (discarded to null). Ask before running either."

kernel_layer:
  label: "eBPF LSM enforcement (hwprivacy-lsm). Plan: ~/.claude/plans/curried-swinging-scone.md"
  phase_1_result:
    date: "2026-08-04 23:09"
    status: "VALIDATED — attached on first try, no verifier rejection"
    what_ran: "sudo hwprivacy-lsm --summarize, observe-only, denies nothing"
    observed: |
      OPENS  ROLE    DEVICE              EXE
      10     CAMERA  /dev/video0         /usr/lib/firefox-esr/firefox-esr
      3      CAMERA  /dev/video1         /usr/lib/firefox-esr/firefox-esr
      1      MIC     /dev/snd/pcmC0D0c   /usr/bin/pipewire
    simultaneous_pipewire_layer_log: |
      23:09:13  Firefox [pipewire-pulse]  microphone  ASKED
      23:09:13  Firefox [pipewire-pulse]  microphone  ASKED
      23:09:16  Firefox [pipewire-pulse]  microphone  STREAM_DENIED
      23:09:19  Firefox [pipewire-pulse]  microphone  STREAM_DENIED
      camera events: 0
    proves:
      - "g5_camera_bypass confirmed from BOTH sides in the same 7-second window: 13 kernel-visible camera opens, 0 PipeWire events."
      - "The two layers are complementary, not redundant. For the microphone the kernel sees only /usr/bin/pipewire holding the device and cannot tell which app is behind it; PipeWire sees 'Firefox wants the mic' but is blind to the camera. Neither alone is sufficient."
      - "Exe-inode identity works: resolved /usr/lib/firefox-esr/firefox-esr, NOT the /usr/bin/firefox shell script."
      - "Identity is discriminating: firefox-esr is ino=30287776, the Developer Edition in $HOME is ino=1310763. Allowing one does not allow the other. The PipeWire layer calls both 'Firefox'."
  phase_2_result:
    date: "2026-08-05"
    status: "PASSED — kernel camera enforcement works end to end"
    test: "~/projects/claude-run/hwprivacy-camera-enforce-test-20260805.sh"
    phases:
      baseline: "camera reachable with nothing attached — PASS"
      deny: "enforcing with an empty allowlist, ffmpeg got EPERM and it was reported — PASS"
      allow: "ffmpeg allowlisted by inode, camera reachable — PASS"
      restore: "detached, camera reachable again — PASS"
    policy_key_agreement: |
      USERSPACE  dev=271581186  ino=30027059  perms=0x01  /usr/bin/ffmpeg
      KERNEL     dev=271581186  ino=30027059  perms=0x01
    two_failures_before_it_passed:
      - >
        policy.rs inserted the glibc st_dev (66306) where the eBPF program reads
        the kernel's own s_dev (271581186 = major 259 << 20 | minor 2). Every
        policy lookup missed, so default-deny denied the allowlisted binary too.
        Neither side errors — it presents as 'enforcement works, allowlist does
        not'. This is the SAME hazard already documented for i_rdev and already
        covered by a regression test, repeated in a different field. Fix: all
        dev_t conversion now lives in device_index::glibc_to_kernel_dev().
      - >
        The second run tested a STALE BINARY. `cargo test` builds a separate
        cfg(test) harness and does not refresh target/debug/hwprivacy-lsm; 30
        passing unit tests said nothing about the binary being executed. Fix:
        the acceptance script now runs cargo build itself and prints the
        binary's mtime.
    tooling_added_as_a_result:
      "--dump-policy": "reads the policy map back out of the kernel and prints it beside what userspace intended, so a key mismatch is a 30-second diagnosis instead of a hypothesis"
    phase_3_acceptance_criteria:
    status: "DEFINED 2026-08-05, not yet run. Written BEFORE the test script, deliberately."
    why_defined_first: >
      Costin: "we need to establish first the tests for this phase". Writing the
      criteria before the script stops the script from quietly becoming the
      definition of success — which is how a test ends up asserting whatever the
      code happens to do.
    what_phase_3_claims: >
      The daemon connects to the kernel helper, pushes the allowlist from
      config.toml, and surfaces kernel camera events through the EXISTING
      frontends with no frontend changes.

    a_connection:
      a1: "helper stopped -> hwprivacy-ctl status says 'Connected: no'   [ALREADY VERIFIED 2026-08-05]"
      a2: "helper started with --socket -> ctl says 'Connected: yes' and names the enforcement state"
      a3: "kill the helper -> ctl returns to 'Connected: no' within ~10s, daemon does NOT crash"
      a4: "restart the helper -> daemon reconnects by itself, WITHOUT restarting the daemon"

    b_policy_push:
      b1: "the helper reports applying exactly the exe_path entries from config.toml that have camera = allow"
      b2: "--dump-policy shows firefox-esr's (dev, ino) present in the kernel map"
      b3: "a rule with camera = allow but NO exe_path is logged as a gap, not silently skipped"
      b4: "a rule with a bogus exe_path is reported unresolved AND counted in ctl status — under default-deny that app is being denied and must not be invisible"

    c_event_flow:
      note: "This is the actual point of Phase 3 — everything else is plumbing."
      c1: "a denied camera open appears in `hwprivacy-ctl log`"
      c2: "the same event appears in the TUI Events panel"
      c3: "the same event appears in the GUI Events tab"
      c4: "a desktop notification appears, informational only (NO action buttons), and its text warns that call audio may also stop"
      c5: "blocked-attempts in ctl status rises by the TOTAL opens (13 for a Firefox session), not by 1 — the coalesced burst must not under-count"

    d_enforcement_regression:
      d1: "firefox-esr, allowlisted via config.toml, CAN use the camera"
      d2: "a binary that is not allowlisted (ffmpeg) is denied"
      d3: "stopping the helper restores camera access immediately"

    e_non_interference:
      e1: "the PipeWire layer keeps working — mic/monitor events still logged as before"
      e2: "daemon NRestarts stays 0 — no repeat of the D-Bus bus-name crash loop"

    known_gaps_this_test_will_NOT_cover:
      - "The GUI/TUI checks (c2, c3) are visual and cannot be asserted by a script — they need Costin's eyes."
      - "c4 is visual too: whether a notification actually appeared, and whether its wording reads right."
      - "Nothing here tests the audio path. Audio is Phase 5 and is deliberately untouched."

  c5_closed_2026_08_19:
    status: "CLOSED. Measured, defect found, fixed, and re-verified against a live kernel."
    why_it_was_unverifiable_before: >
      The test asked a human to start a video call in a browser that was
      ALLOWLISTED, so nothing was denied and the counter could not move. It
      also asserted only `delta >= 10`, which would have passed the very bug it
      existed to catch.
    how_it_was_measured: >
      A deterministic burst from one unprivileged process opening /dev/video0 N
      times inside the coalescing window. No browser, no notification, no human
      as the sensor. Two independent sources compared: the helper's own --json
      output (kernel truth) against Blocked attempts over D-Bus (daemon belief).
    the_defect: >
      A burst summary carries pid 0 and accounts for opens the kernel already
      suppressed. It fell through to log_event(), which increments
      blocked_count itself for a Denied action, on top of the additional_opens
      it was reporting. A 13-open denied burst counted as 14. It also wrote a
      second, pid-0 DENIED row into the user-visible event log for a session
      with only one real access.
    measured_before_fix:
      - "13 opens denied -> kernel reported 13, daemon counted 14"
      - "reproduced 3x; a constant +1, never proportional"
    measured_after_fix:
      - "opens 1 -> kernel 1, daemon 1"
      - "opens 5 -> kernel 5, daemon 5"
      - "opens 13 -> kernel 13, daemon 13"
      - "opens 27 -> kernel 27, daemon 27"
      - "headless Chrome (real browser) -> kernel 2, daemon 2"
      - "event log: 4 bursts -> 4 rows, not 8"
    regression_guard: "tools/camera-accounting-check, plus 4 unit tests in lsm_client"

  d1_mechanism_proven_2026_08_19:
    status: "The MECHANISM is proven. Firefox specifically is still untested."
    evidence: >
      With Chrome allowlisted by inode (exe_path = /opt/google/chrome/chrome):
      denied before the rule existed, denied again on repeat, allowed after.
      Allowlisting by executable inode works end-to-end.
    h1_is_not_a_standing_bug: >
      Reconnect after a daemon restart works, and so does the policy push that
      follows it — the helper logged 'policy set by daemon - 2 allowed' for the
      new client. The earlier 'Connected: no' readings were taken during the
      10s retry gap, not a fault.
    still_open: >
      Firefox itself. That is a question about Firefox's own state, not about
      whether hwprivacy works. Costin wants more subjects added (headless
      Firefox, VLC, other launchable local software) — DISCUSS BEFORE BUILDING.

  phase_3_result_2026_08_05:
    status: "11 of 13 automated checks pass. Both failures are TEST bugs, but one hides an unverified feature."
    passing: "A1 A2 A3 A4 B3 B4 C1 C2 C3 C4 D2 D3 E2 — connection, reconnect, policy push, gap reporting, unresolved reporting, enforcement, event flow into the daemon, restore, non-interference"
    b1_false_failure:
      verdict: "TEST BUG. The policy WAS pushed."
      evidence: "Same run reported 'Allowed binaries: 1', 'Camera enforced: yes', and B4's 'UNUSABLE entries: 1' — none of which can appear unless SetPolicy was processed."
      cause: >
        The check waited for 'Connected: yes', which fires on the Hello reply,
        then immediately grepped for the policy line, which lands a moment
        later on SetPolicy. Part 1 shows 'Allowed binaries: 0' and Part 2 shows
        1 — the race is visible in the transcript.
      note: "Third time in this project a test waited for the wrong condition. Wait for the thing being asserted, not a proxy that happens to be nearby."
    c5_still_unverified:
      verdict: "TEST DESIGN FLAW. The burst-count fix has never actually been exercised."
      what_happened: >
        Part 2 asks for a call that 'should FAIL', but the daemon had already
        pushed the allowlist by then, so Firefox was ALLOWED. The burst was
        coalesced and reported correctly — 'burst closed: 12 further open(s) by
        firefox-esr' — but with denied=false, so it rightly did not count
        toward blocked attempts. The only denied app was ffmpeg, which opens
        the camera once and never bursts.
      why_it_cannot_pass_as_written: "C5 needs an app that is BOTH denied AND bursting. ffmpeg bursts never; Firefox is allowlisted."
      fix_required: >
        Temporarily set firefox camera = deny in config.toml for the deny
        phase, restart the daemon, then restore — the same pattern Part 4
        already uses safely for its bogus entry.
    d1_unclear:
      what: "Costin reported the call did not work even after Firefox was allowlisted."
      but: "Allowed binaries: 1 and the burst shows firefox-esr opening the camera 13 times without denial."
      hypotheses_not_yet_tested:
        - "The helper is restarted between the deny and allow steps; for up to 10s until the daemon reconnects it enforces an EMPTY allowlist. A click in that window is denied."
        - "The open-fd gap: Firefox may hold state from the earlier attempt."
      status: "UNRESOLVED. Needs a focused test, not a guess."
    c4_scored_wrong_twice:
      what: "Costin answered 'no' to whether the notification mentioned call audio, while his own pasted text contained the sentence verbatim."
      cause: "He pasted TWO notifications — the kernel one (which has the caveat) and the old PipeWire mic prompt (which does not, correctly). The question did not distinguish them."
      lesson: "When asking a human to verify wording, say WHICH notification, not just the wording."

  phase_4_continuous_operation_and_audit:
    status: "RESHAPED 2026-08-05 by an explicit requirement from Costin. Not started."
    requirement_verbatim: >
      "i expect a long time usage with some logs that you'll visit later (after
      few days etc) and have a better grasp of who tried to connect etc"
    the_gap_this_exposes:
      what: "Nothing survives a restart today, so that review is currently impossible."
      detail:
        - "The daemon's event log is a 500-entry IN-MEMORY ring buffer (g3). Lost on every restart, and it is what hwprivacy-ctl log reads."
        - "Kernel events are folded into that same ring buffer, so they are equally volatile."
        - "hwprivacy-lsm prints to a terminal. Close the terminal and the record is gone."
        - "Event timestamps are '%H:%M:%S' with NO DATE (g4) — ambiguous the moment a log spans midnight, useless across days."
      verdict: >
        Phase 4 was scoped as 'add a systemd unit'. That is not enough. The unit
        is what makes the helper RUN continuously; persistence is what makes the
        running worth anything.
    approach:
      primary: >
        Let the systemd journal be the audit store. A helper running as a
        service has its stdout captured automatically, with real timestamps,
        rotation and retention already solved. Zero new storage code, and
        `journalctl` is a better query tool than anything worth writing here.
      structured: >
        Run the helper with --json so the journal holds one NDJSON object per
        event — greppable AND machine-readable later, rather than a table that
        has to be re-parsed.
      queries_it_should_make_possible:
        - "journalctl -u hwprivacy-lsm --since '3 days ago' | grep DENIED"
        - "who touched the camera at all this week, and how many times"
        - "which binaries appeared that are NOT in the allowlist — the discovery loop for new consumers"
      also_needed:
        - "Fix g4: put a full date on daemon event timestamps, or the in-memory log stays unreadable across days even while it lives."
        - "Consider a periodic --summarize digest, so a week of events collapses to a per-consumer table rather than thousands of lines."
    verified_2026_08_05:
      journal_is_persistent: "/var/log/journal exists; hwprivacy entries retained from 30 June to 5 August — 36 days, with no configuration needed."
      the_query_already_works: |
        journalctl --user -u hwprivacy --since "3 days ago" \
          | grep -oE 'Event: .* → (Microphone|Camera|Monitor) → [A-Z_]+'
      what_it_surfaced: >
        AnyDesk was denied the playback monitor 4 times. A remote-desktop tool
        attempting to tap what the speakers were playing, caught by the one
        PipeWire feature that genuinely works — and only visible by reading the
        log days later, which is precisely the use case Costin described.
      an_argument_for_the_kernel_layer_as_the_audit_source: >
        The same query shows 'Firefox (pid:2332)' and 'Firefox (pid:2275)' as
        two separate consumers, because PipeWire-layer labels embed a pid that
        changes on every restart. Over 36 days that fragments into noise. The
        kernel layer keys on exe_path, which is stable across restarts and
        reboots, so its records aggregate correctly over long windows. This
        makes b4 (pid-bearing labels) worse the longer the window gets.

    fail2ban_shaped_reporting:
      status: "PROPOSED 2026-08-05 by Costin. Fits Phase 4's reporting half."
      what_transfers: >
        Fail2ban's useful idea is not banning, it is that FREQUENCY IS SIGNAL.
        One denial is noise; fifty in an hour is an application persistently
        trying. A flat event log cannot express that difference; an
        offender table can.
      mapping:
        jail: "device class — camera / mic / monitor"
        filter: "NOT NEEDED. Our events are already typed. Fail2ban parses text with regexes only because it has no other channel."
        maxretry_findtime: "N denials within M minutes marks an app persistent rather than incidental"
        client_status: "`hwprivacy-ctl offenders` — who has been trying, how often, since when"
        ban_database: "persistent per-executable counters that survive restart"
      what_does_NOT_transfer:
        ban: >
          There is nothing to ban. Fail2ban blocks an attacker who is otherwise
          getting through; we already deny by default, so a repeat offender is
          already blocked on every attempt. Escalating to a ban is meaningless
          here — the escalation must be INFORMATIONAL.
      the_direction_fail2ban_has_no_analogue_for:
        what: "Repeat denials of an app the user WANTS to work."
        example: "'Signal denied the camera 12 times' means add an exe_path, not that Signal is hostile."
        why_it_matters: >
          This turns the audit log into the discovery loop for building the
          allowlist. Arguably more valuable day-to-day than catching hostile
          apps, and it is the reverse of what fail2ban is for.
      trap_to_avoid: >
        Do not scrape our own text output with regexes. Fail2ban does that
        because it has no typed channel; we do. Aggregating over structured
        events keeps the display format out of the security logic.

    explicitly_not:
      - "Do not build a database. The journal already solves storage, rotation and retention — verified above, 36 days retained."
      - "Do not reimplement fail2ban's log-scraping. See fail2ban_shaped_reporting > trap_to_avoid."
      - "Do not invent a log format before checking what journalctl -o json already gives."

  phase_5_audio_backstop:
    status: "AGREED IN PRINCIPLE 2026-08-05, not started. Comes after Phase 3."
    question_asked: "Should exe_path also gate the microphone at the kernel layer?"
    answer: >
      Yes, but NOT as per-app mic policy — that is impossible here and saying
      otherwise would oversell it. Measured: /dev/snd/pcmC0D0c is opened by
      /usr/bin/pipewire, so the kernel sees the audio server and cannot tell
      which application is behind it. Per-app mic identity exists only in the
      PipeWire layer.
    what_is_achievable: >
      A BACKSTOP: only the audio server may open a CAPTURE device. That closes
      g6_alsa_bypass (ffmpeg -f alsa currently records freely) without claiming
      an attribution the kernel cannot make.
    design:
      - "New BPF map of ALSA capture minors, populated by userspace from DeviceIndex, which already classifies pcmC*D*c by name."
      - "eBPF enforces major 116 only when the minor is in that set — playback and mixer-control nodes are untouched."
      - "Allowlist holds /usr/bin/pipewire (and wireplumber/pipewire-pulse if they open devices directly — must be measured, not assumed)."
      - "PERM_AUDIO already exists in hwprivacy-proto and is never set. This is what it is for."
    risk: >
      Larger blast radius than the camera. Direct-ALSA applications exist —
      music production tools, JACK setups, some games. Restricting to capture
      minors shrinks it, but this needs an observe-only pass first to find out
      what actually opens capture devices on this machine before anything is
      denied.
    do_not: "Do not fold this into Phase 3. One variable at a time — Costin's rule, and it has already paid off twice."

  still_unproven:
      coalescing: >
        ffmpeg opens the camera once, so there was no burst to collapse and
        'lines reporting suppression: 0'. Coalescing is implemented but has
        never actually fired. Firefox's 13-open burst is the only thing that
        exercises it — see the firefox end-to-end test.

  phase_2_firefox_end_to_end:
    date: "2026-08-05 10:39"
    status: "PASSED against a real application"
    test: "~/projects/claude-run/hwprivacy-firefox-enforce-test-20260805.sh"
    phase_a_deny: |
      10:39:47  DENIED  CAMERA  /dev/video0  VideoCapture  3271  /usr/lib/firefox-esr/firefox-esr
      WhatsApp Web showed: "Camera or microphone not found — You can't make a
      call because it looks like your computer doesn't have a camera or
      microphone."
    phase_b_allow: |
      10:40:43  allow   CAMERA  /dev/video0  VideoCapture  3271  /usr/lib/firefox-esr/firefox-esr
      Call proceeded to "Ringing..." with live camera preview.
    proves:
      - "The kernel denial reaches the application as a real failure, not a silent black frame."
      - "Retry after allowing is ONE CLICK in the already-running browser. Same pid 3271 across both phases — no tab reload, no Firefox restart."
      - "Policy key agreement confirmed by --dump-policy: dev=271581186 ino=30287776 on both sides."
      - "Identity discrimination is live: only /usr/lib/firefox-esr/firefox-esr was allowed; the Developer Edition in $HOME stayed denied. The PipeWire layer calls both 'Firefox'."
    finding_getusermedia_is_all_or_nothing:
      what: "WhatsApp reported 'camera or MICROPHONE not found' although only the camera was ever denied."
      why: "getUserMedia({audio: true, video: true}) fails as a unit. Denying video kills the audio path with it."
      consequence: >
        A camera denial can silently break an AUDIO call. Phase 3 notification
        wording must say so, e.g. 'camera blocked for X — this may also stop the
        call audio', or it will be mistaken for a microphone bug later.
    defect_found_and_fixed_same_session:
      what: "Coalescing worked (13 opens -> 1 event) but the suppressed count was never surfaced."
      why: "The kernel attaches the count to the NEXT emitted event; a burst that happens once never gets one. Both phases printed 'no suppression reported' while 12 denials sat stranded in the map."
      severity: "not a security hole — every open was still denied — but the log under-reported denials 13:1"
      fix: "userspace flushes stale coalescing entries every 500ms and on exit, reports 'burst closed: N further open(s)', and clears the counter while preserving last_ns"
      status: "fixed, NOT yet re-verified against Firefox"

  new_requirement_for_phase_2:
    finding: "One camera session produced 13 opens in a single second (10 on /dev/video0, 3 on /dev/video1)."
    consequence: >
      Denying without coalescing would emit 13 EPERMs and 13 notifications.
      This is the same defect as b3_duplicate_prompts in the PipeWire layer.
      Phase 2 must dedupe by (exe key, device major) with a cooldown from the
      start rather than reproduce it.
  known_policy_keys:
    note: "(dev, ino) pairs as Phase 2 will store them. Package upgrades change the inode — see the staleness mitigation in the plan."
    firefox_esr: "dev=66306 ino=30287776  /usr/lib/firefox-esr/firefox-esr"
    firefox_dev_edition: "dev=66306 ino=1310763   /home/perieteanu/firefox-developer/firefox-bin"
    pipewire: "dev=66306 ino=30017535  /usr/bin/pipewire"
  still_unobserved:
    - "Discord, Zoom, Telegram, OBS, cheese, and the Firefox Developer Edition have not yet been seen touching either device."
    - "Not a blocker: default-deny plus a notification surfaces each new consumer the first time it appears. That IS the discovery mechanism."
  hook_overhead_measured:
    date: "2026-08-05"
    status: "MEASURED — the architecture passes on cost"
    what: "Cost of the LSM hook, which fires on EVERY open() system-wide."
    why_it_mattered: "Costin rejected the PipeWire layer's 1.2% idle CPU. This number decided whether the kernel layer was acceptable at all."
    method: >
      Paired/interleaved A-B design, 10 cycles. Each cycle measures baseline
      and attached back-to-back and computes that cycle's delta, so slow
      machine drift cancels. Minimum-of-5 within each run (noise is one-sided,
      it only adds). Pinned to one CPU with taskset. Benchmark opens /dev/null
      (major 1), i.e. the common case the program inspects and rejects.
      Script: ~/projects/claude-run/hwprivacy-lsm-overhead-v2-20260805.sh
    result:
      overhead_mean_ns: 13.75
      overhead_median_ns: 15.4
      ci95_ns: "[+7.3, +20.2] — excludes zero"
      consistency: "9/10 cycles positive, sign test p = 0.021"
      relative: "1.88% of a 733 ns open()"
      contamination: "clean run, 0 camera/mic events fired"
    cost_at_rate:
      "100/sec": "0.00014% of one core"
      "1,000/sec": "0.0014% of one core"
      "10,000/sec (heavy build)": "0.0138% of one core"
      "100,000/sec (unrealistic)": "0.1375% of one core"
      idle: "0.0000% — the hook does not run when nothing opens a file"
    verdict: >
      Acceptable. At a realistic heavy load the PipeWire polling layer is ~87x
      more expensive, and at idle the ratio is infinite: 1.2% of a core burns
      constantly whether or not anything happens, while this bills per syscall
      and is free when the machine is quiet. This is the structural difference,
      not just a smaller number.
    two_false_starts_worth_remembering:
      - >
        v1 used a blocked design (all baseline runs, then all attached runs).
        Machine drift of 206 ns accumulated between blocks while the effect was
        ~15 ns. It reported +166 ns / +19.9%, which was mostly drift. A mic
        event fired mid-run made it worse: each event makes the observer
        resolve /proc and print, which is USERSPACE work competing with the
        benchmark, not hook cost. v2 now counts such events and flags the run.
      - >
        v2's first verdict rule compared range (max-min) against the median and
        called this perfectly good run 'inconclusive'. Range is dominated by the
        single most extreme value and grows with sample size, so one noisy cycle
        vetoed nine consistent ones. Replaced with a t-based confidence interval
        plus a sign test.
    still_unmeasured:
      what: "Cost of the INTERESTING path — what one camera/mic event costs (ringbuf drain, /proc resolution, printing)."
      why_lower_priority: "Events are rare (a handful per day) vs opens (millions). Matters for Phase 2 notification behaviour, not for system-wide overhead."


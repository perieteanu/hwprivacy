  q-dismiss-semantics:
    question: "When the user dismisses a rule prompt without choosing, what should happen?"
    blocks: "b1_dismiss_writes_deny — the fix is trivial once this is answered"
    options:
      a: "block this attempt, save nothing, 60s cooldown, ask again later (what README documents)"

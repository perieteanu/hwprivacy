blockers:
  label: "Why it 'did not work properly'. ALL FOUR FIXED 2026-08-21."
  b1_dismiss_writes_deny:
    severity: critical
    status: "FIXED 2026-08-21. Every new test verified to FAIL against the reintroduced defect before being kept."
    what: "Dismissing a notification wrote a permanent `deny` rule instead of doing nothing."
    was_where: "notification.rs — `perm.or(Some(Permission::Deny))` at the end of ask_user_permission()"
    effect: "The unreachable `None` arm in main.rs meant record_dismiss()/is_in_cooldown() were dead code. Config silently accumulated denials the user never chose."
    evidence: "journalctl 18:47:04 — 'dismissed — no rule saved' immediately followed by 'User set rule: ... = deny'"
    fix: >
      ask_user_permission() now returns PromptOutcome — Chosen / Dismissed /
      Failed — so a dismissal, a decision, and a broken notification daemon stop
      being the same value. The decision itself moved out of the tokio::spawn
      into the pure function notification::decide(), because the invariant that
      had to hold ("nothing but a button press reaches SavePermanentRule") was
      previously in a place no test could reach.
    second_defect_found_while_fixing: >
      The error paths returned Some(Deny) too. On a headless session, or with no
      notification daemon running, EVERY prompt became a permanent deny rule.
      Failed is now treated exactly like Dismissed: blocked, nothing written.
    regression_guard: "tools/doc-check SENTINELS refuses the old expression anywhere in the tree."

  b2_stale_oneshot_grants:
    severity: critical
    status: "FIXED 2026-08-21."
    what: "`ask_each` streams got silently ALLOWED with no prompt."
    where: "hwprivacy-daemon/src/stream_tracker.rs grant_one_shot()"
    effect: "one_shot_allowed: Vec<u32> was never pruned and was keyed on the PipeWire node id, which PipeWire recycles. An old grant leaked onto an unrelated later stream."
    evidence: "live event log — 'Firefox [pipewire-pulse] microphone ALLOWED' while config says microphone = ask_each"
    the_camouflage: >
      StreamInfo's field was NAMED object_serial but policy_engine.rs assigned
      node.id to it. PipeWire's object.serial is monotonic and never reused; a
      node id is reused freely. Under the wrong name the bug read as a tuning
      issue rather than a grant landing on somebody else's stream. The field is
      now called node_id, and pw-dump's real object.serial is still not parsed.
    fix: >
      Grants are keyed on (node_id, normalised app name) and pruned every poll
      against the live node set. Pruning alone still leaves a race — an id can
      be freed and reused between two polls — so the app name is what actually
      closes the cross-application case.
    regression_guard: "doc-check SENTINELS refuses `one_shot_allowed: Vec<u32>`."

  b3_duplicate_prompts:
    severity: high
    status: "FIXED 2026-08-21. Every new test verified to FAIL against the reintroduced defect."
    what: "A stereo capture produced two identical BLOCKED popups and two rule prompts."
    evidence: "event log shows exact pairs: 18:45:17 monitor DENIED x2, 18:45:19 x2, 18:45:22 x2"
    reframed_2026_08_19: "b3 is a LABELLING bug, not a duplication bug. Coalescing would destroy the only handle on which mic is being requested — and per-channel gating was measured to work: right mic cut mid-capture went to rms 0.0 while the left kept recording and the app never noticed."
    split_by_category_2026_08_21: >
      The 2026-08-19 reframe is right for the MICROPHONE and wrong for the
      MONITOR, and applying one treatment to both is what made either look
      broken. Read out of the live graph:
        node=46 Audio/Source  capture_FL(64) capture_FR(65)  -> two microphones
        node=36 Audio/Sink    monitor_FL(61) monitor_FR(63)  -> two CHANNELS, one sink
      A sink monitor has no independent-gating story. Recording what the
      speakers play is one act against one device, so its two links ARE
      duplicates — seen live 2026-08-21, two identical
      "OBS -> Monitor -> ALLOWED" rows in the same second.
    fix:
      microphone: "one prompt per port, labelled mic1..micN — ordinals assigned by sorted port NAME, never port id, never discovery order."
      monitor: "the sink's channel links are coalesced by (device, app) into ONE decision and one prompt."
      camera: "untouched — one link."
      surfaces: "the label reaches the notification, the event log, and hwprivacy-ctl log (AccessEvent gained device_instance; get_events emits device_display())."
    the_trap_it_would_have_been: >
      Coalescing the PROMPT must never coalesce the ENFORCEMENT. A LinkGroup
      carries every link id and destroy_links() tears down all of them; had it
      destroyed only the representative, one channel would keep flowing while
      the popup said BLOCKED — worse than the double prompt it replaces.
      Covered by a test proven to fail against exactly that mistake.
    what_this_is_NOT: >
      Labelling only. Rules are still per CATEGORY. Per-device rules
      ("mic2 = deny") remain deferred — CONVENTIONS lists config.toml among the
      places ordinals apply, but that is the destination, not this step.

  b4_dead_rules_in_config:
    severity: medium
    status: "CODE FIXED 2026-08-21. The live config still holds the three dead rules — cleaning them is a manual step with the daemon stopped."
    what: "TWO of the 9 live rules can never match anything. The third was miscounted."
    detail:
      - "app_name = '' — DEAD. No stream is ever named empty (parse_node falls back to 'unknown')."
      - "app_name = 'Firefox [pipewire-pulse] (pid:2332)' — DEAD. Ends with ')', so normalize_app_name strips nothing."
    correction_2026_08_23: >
      'pipewire [pipewire-pulse]' was listed here as the third dead rule since
      2026-08-04. It is NOT dead. normalize_app_name strips a trailing " [...]",
      so it normalises to the key "pipewire" and matches perfectly. It is live
      and it is denying: the history table shows 16 monitor and 8 microphone
      denials attributed to "pipewire", and with default_action = "ask" an
      UNMATCHED app would have been ASKED, not DENIED. Those denials are the
      rule firing.
    consequence_found_2026_08_23: >
      That rule occupies the "pipewire" key, so `preset import desktop-baseline`
      skips both of its entries on this machine — correctly, because an import
      never changes a rule the user already has. Removing the rule is therefore
      a PREREQUISITE for the baseline here, not just tidying.
    root_cause: "notification bodies render '{app} (pid:{n})' and users paste that string into the rule form"
    fix: >
      config::sanitize_rule_name() runs on WRITE — it strips a trailing
      "(pid:N)", applies normalize_app_name, and refuses anything that cannot
      become a key (empty, or a bare "[annotation]"). set_rule() returns false
      instead of storing junk, and SetRule over D-Bus reports the refusal.
      Notification bodies now print an explicit "Rule name: firefox" line, so
      the string a user copies is the one that works.
    why_the_matcher_was_left_alone: >
      normalize_app_name runs on every lookup and decides access. Widening it
      would make all future matching fuzzier to repair a write-time mistake.
      Sanitising happens once, on input, where a bad result is visible in
      config.toml immediately instead of being silently wrong forever.

b6_resident_prompt_never_times_out:
  severity: medium
  status: "FIXED 2026-08-23. Costin's ruling: the prompt STAYS until answered, and the answer governs what follows."
  found_how: >
    Verifying that an unanswered prompt writes nothing. It writes nothing, which
    is the b1 fix working. But the "ask again later" half of the documented
    contract never happens.
  what: >
    notification.rs sets BOTH Hint::Resident(true) and timeout(60000). Resident
    tells the notification daemon to keep the popup until the user acts, and it
    wins — the 60s timeout never fires, wait_for_action() never returns, and the
    spawned task sits there forever.
  evidence_2026_08_21: |
    16:02:59  parecord -> monitor  ASKED     (prompt appears, left unanswered)
    16:04:48  parecord -> monitor  ASKED     (109s later — a SECOND prompt)
    config.toml: byte-identical throughout, sha256 0f28b14112d532d5, 9 rules
    journal: no "nothing saved" / "quiet for" line, ever
    daemon threads: 22 with nothing pending, 23 with prompts pending
  what_it_means:
    - "record_dismiss() is still never called on a TIMEOUT, so the cooldown never starts and the same app re-prompts on every new stream."
    - "The dismiss contract in CONVENTIONS is only half true: 'save nothing' works, 'ask again after the cooldown' does not — because the first ask never ends."
    - "Each pending prompt holds a blocking thread (spawn_blocking + wait_for_action). Tokio's blocking pool is bounded, so enough unanswered prompts would eventually starve it. Magnitude not measured — the observed delta was +1 thread for 2 pending prompts, so they are not strictly 1:1."
    - "Popups accumulate on screen rather than one being re-asked."
  not_introduced_by_b1: >
    Resident + timeout has been there since the beginning. Before b1 was fixed
    this was invisible, because closing the popup wrote a deny and nobody
    examined the timeout path. Fixing b1 is what made the gap legible.
  decision_2026_08_23: >
    A permission question is a to-do item, not a nag. The prompt stays until it
    is answered — one that vanishes while you are away leaves the app silently
    broken with no explanation. What gets contained is the STACKING, not the
    persistence.
  fix:
    - "timeout(60000) -> Timeout::Never. The old value was a lie in two directions: Resident already overrode it, and the code downstream was written believing it did not."
    - "One pending prompt per (app, device), keyed on the NORMALISED name. A second stream is blocked and logged, and says nothing — the question is already on screen."
    - "The claim is released on every path out of the prompt task. Leaking it would mean that (app, device) is never asked about again for the life of the daemon: no popup, no error, nothing in the log."
  what_did_NOT_change: >
    The dismiss cooldown stays. It was never wrong — it simply could not be
    reached, because the only way to reach it was a timeout that never fired.
    Actively closing a popup still means: block, save nothing, cool down, ask
    again. That is d-dismiss-saves-nothing, now actually reachable.
  verified_live_2026_08_23: |
    14:58:15  parecord -> monitor  ASKED    (left unanswered)
    14:58:23  parecord -> monitor  DENIED   (no second popup)
    14:58:31  parecord -> monitor  DENIED
    Before the fix all three logged ASKED and raised three popups.

policy_staleness_2026_08_21:
  label: >
    Three ways the kernel map drifted away from config.toml while every status
    surface reported healthy. Found by reading two days of live journals, not by
    reading code. All FIXED 2026-08-21 by one mechanism.
  s1_binary_replaced_by_a_package_upgrade:
    severity: "critical — enforcement silently stopped for an allowlisted app"
    measured_live: |
      08-20 08:03:35  daemon pushes policy  -> "2 executable(s) allowed"
      08-20 08:05:16  dpkg: firefox-esr 140.13.0esr -> 140.14.0esr
      08-20 09:45:14  DENIED /usr/lib/firefox-esr/firefox-esr ino=30282365
      08-20 18:10:14  DENIED   (same, 8.5 hours later, same pid)
      08-21 08:42     reboot -> helper reloads its cache -> ALLOWED again
    what: >
      The kernel matches on the executable's inode. A package upgrade gives the
      same path a new inode; the map kept the old one. For sixteen hours
      config.toml said camera = "allow" and hwprivacy-ctl status said
      "Allowed binaries: 2", while Firefox was being denied.
    why_it_was_never_noticed: >
      It repairs itself at the next boot, when the helper re-resolves paths from
      /var/lib/hwprivacy/policy. The docs had PREDICTED this exact failure —
      phase_4_stage_1 > stores_paths_not_inodes calls it "the hardest possible
      failure to notice" — but the mitigation only covers helper start, not a
      package upgrade during a running session.
    also_note: >
      The inode recorded for firefox-esr in four documents (30287776) is now
      wrong; it is 30282365. A hardcoded inode has a half-life of one upgrade.
    fail_open_direction: >
      The reverse is worse and is why this was not left as a documented
      limitation: ext4 reuses inode numbers, so a stale allowlist entry can
      eventually match a DIFFERENT file. Low probability, wrong direction.

  s2_rule_changes_never_reached_the_kernel:
    severity: "critical — the CLI, TUI and GUI were decorative for layer 2"
    what: >
      SetPolicy was sent once per connection, from session(), and never again.
      set_rule/remove_rule in dbus_service.rs did not poke the kernel layer at
      all. Changing a camera rule with hwprivacy-ctl, the TUI or the GUI did
      nothing until the daemon or the helper restarted.
    why_it_matters_more_than_s1: "It needs no package upgrade. It fired every time anybody edited a camera rule."
    probably_explains: "part of the 2026-08-19 D1 confusion, where a config change 'could not be pushed at all'."

  s3_deleted_binary_left_a_key_behind:
    severity: medium
    what: "An allowlisted binary that is removed leaves its key in the map and is never re-reported."

  the_one_fix:
    where: "hwprivacy-daemon/src/lsm_client.rs — PolicyFingerprint"
    what: >
      The session loop is now a tokio::select! over incoming replies and a
      recheck tick. Each tick fingerprints the INTENDED allowlist —
      (exe_path, dev, ino) per entry, sorted, plus the enforcement flag — and
      re-pushes SetPolicy when it differs, logging what moved
      ("<path> ino 30287776 -> 30282365 (binary replaced)").
    covers: "s1, s2 and s3 with one mechanism, because all three change that fingerprint."
    knob: "policy.exe_recheck_secs, default 30. Set 0 to disable."
    cost: "a handful of stat() calls on paths already named in the config — microseconds. This is not the pw-dump situation."
    deliberately_not_inotify: >
      No notify/inotify crate exists in the workspace and MSRV is Debian 13's
      rustc 1.85. A new dependency in a security tool needs a better reason than
      shaving 30 seconds off a window that was previously sixteen hours.
    dev_encoding_note: >
      The daemon's (dev, ino) are glibc-encoded and used ONLY to detect change.
      Authoritative resolution stays in the helper's PolicyKey::from_path, the
      one caller of glibc_to_kernel_dev(). Duplicating that conversion is the
      trap that has already bitten this project twice.

security_gaps:
  label: "Real holes not listed in README > Known Limitations."
  g1_grandfathered_links:
    what: "Links that already exist when the daemon starts are never evaluated."
    where: "main.rs:158 seeds known_link_ids with every link from the initial capture, then only the diff is processed"
    effect: "A mic tap active before daemon start survives forever. Also means every daemon restart re-grandfathers everything."
    fixed_free_by: "d-event-driven-substrate (registry enumeration gives existing objects on connect)"

  g2_blockall_does_not_block:
    what: "The emergency Block All button does not stop anything already recording."
    where: "dbus_service.rs block_all() only sets state.block_all = true, which gates NEW links"
    effect: "Existing allowed links keep flowing. The button implies a panic-stop it does not deliver."
    note: "link_manager.rs:33 destroy_all_links_to_node() already exists and is never called — it is exactly the missing piece."

  g3_no_persistent_audit:
    what: "The event log is a 500-entry in-memory ring buffer, lost on every restart."
    effect: "No forensics. 'Did anything use my mic last Tuesday' is unanswerable."

  g4_timestamps_lack_a_date:
    status: "CLOSED 2026-08-19 — timestamps now carry a full date; ctl and TUI columns widened to match (at width 10 the date rendered and the clock was cut off)."
    what: "AccessEvent.timestamp was '%H:%M:%S' only."
    effect: "Events were ambiguous past midnight — and useless for reading a log back days later, which is what Phase 4 exists for."

  g5_camera_bypass:
    severity: "critical — the camera feature does not function against the real threat"
    discovered: "2026-08-04, by direct experiment on the live system"
    what: "Opening /dev/video0 directly via V4L2 is completely invisible to hwprivacy."
    why: >
      Firefox and Chrome acquire the camera through V4L2 directly, not through
      PipeWire. No PipeWire node is created, no link appears, so the link-diff
      monitoring substrate has nothing to observe.
    evidence: |
      ffmpeg -f v4l2 -i /dev/video0 -frames:v 90   (exit 0, 90 frames captured)
                      events  blocked  pw_links  cam_node_state  v4l2_fds_open
        before          64      26       10      suspended             0
        during (x5)     64      26       10      suspended             1
        after           64      26       10      suspended             0
      hwprivacy camera events logged: 0.  journal over the window: no entries.
      The PipeWire camera node (id=68, Video/Source) never left `suspended` —
      PipeWire was not involved at any point.
    fixable_in_pipewire_layer: false
    note: "No amount of polish, event-driven rework, or classification work reaches a process that never talks to PipeWire. Requires eBPF LSM, AppArmor, or device-node ACLs."
    also: "/dev/video1 exists alongside /dev/video0 (typically the UVC metadata node of the same device). Any device-node rule must cover the whole set."

  g6_alsa_bypass:
    severity: "high — microphone protection covers the common path, not the threat"
    discovered: "2026-08-04, same method"
    what: "Opening the mic directly via ALSA (hw:0,0 -> /dev/snd/pcmC0D0c) is equally invisible."
    evidence: |
      ffmpeg -f alsa -i hw:0,0 -t 3    (exit 0, 3s of real microphone audio captured)
                      events  blocked  pw_links  snd_pcm_fds_open
        before          64      26       10             1
        during (x5)     64      26       10             2
        after           64      26       10             1
      journal over the window: no entries.
    consequence: >
      The Phase-1 parecord validation proved that the PIPEWIRE PATH is guarded.
      It did not prove the microphone is guarded. Both statements were conflated.

  honest_coverage_2026_08_04:
    playback_monitor: "REAL and unique. There is no straightforward kernel-level way to tap a sink monitor, so PipeWire is genuinely the correct layer. This feature holds up."
    microphone: "PARTIAL. Blocks apps that route through PipeWire (most desktop apps). Misses anyone who calls ALSA directly."
    camera: "NONE in practice. Only sees the minority of apps that route camera through PipeWire's Video/Source."
    accurate_one_liner: "hwprivacy guards the PipeWire path, well. It is not a hardware permission manager."

  verification_harness:
    purpose: "Reusable acceptance test for any enforcement layer, present or future."
    method: >
      Snapshot (hwprivacy event count, blocked count, pw-dump link count, open
      fds on the device node) before / during / after a direct-access attempt.
      An enforcement layer that works must either make the open() fail or make
      the event count move.
    camera: "ffmpeg -hide_banner -f v4l2 -i /dev/video0 -frames:v 90 -f null -"
    microphone: "ffmpeg -hide_banner -f alsa -i hw:0,0 -t 3 -f null -"
    pass_criterion_for_kernel_layer: "both commands must fail with EPERM for a denied app"
    caution: "the camera test lights the webcam LED; the mic test records real audio (discarded to null). Ask before running either."

kernel_layer:
  label: "eBPF LSM enforcement (hwprivacy-lsm). Plan: ~/.claude/plans/curried-swinging-scone.md"
  phase_1_result:
    date: "2026-08-04 23:09"
    status: "VALIDATED — attached on first try, no verifier rejection"
    what_ran: "sudo hwprivacy-lsm --summarize, observe-only, denies nothing"
    observed: |
      OPENS  ROLE    DEVICE              EXE
      10     CAMERA  /dev/video0         /usr/lib/firefox-esr/firefox-esr
      3      CAMERA  /dev/video1         /usr/lib/firefox-esr/firefox-esr
      1      MIC     /dev/snd/pcmC0D0c   /usr/bin/pipewire
    simultaneous_pipewire_layer_log: |
      23:09:13  Firefox [pipewire-pulse]  microphone  ASKED
      23:09:13  Firefox [pipewire-pulse]  microphone  ASKED
      23:09:16  Firefox [pipewire-pulse]  microphone  STREAM_DENIED
      23:09:19  Firefox [pipewire-pulse]  microphone  STREAM_DENIED
      camera events: 0
    proves:
      - "g5_camera_bypass confirmed from BOTH sides in the same 7-second window: 13 kernel-visible camera opens, 0 PipeWire events."
      - "The two layers are complementary, not redundant. For the microphone the kernel sees only /usr/bin/pipewire holding the device and cannot tell which app is behind it; PipeWire sees 'Firefox wants the mic' but is blind to the camera. Neither alone is sufficient."
      - "Exe-inode identity works: resolved /usr/lib/firefox-esr/firefox-esr, NOT the /usr/bin/firefox shell script."
      - "Identity is discriminating: firefox-esr is ino=30287776, the Developer Edition in $HOME is ino=1310763. Allowing one does not allow the other. The PipeWire layer calls both 'Firefox'."
  phase_2_result:
    date: "2026-08-05"
    status: "PASSED — kernel camera enforcement works end to end"
    test: "~/projects/claude-run/hwprivacy-camera-enforce-test-20260805.sh"
    phases:
      baseline: "camera reachable with nothing attached — PASS"
      deny: "enforcing with an empty allowlist, ffmpeg got EPERM and it was reported — PASS"
      allow: "ffmpeg allowlisted by inode, camera reachable — PASS"
      restore: "detached, camera reachable again — PASS"
    policy_key_agreement: |
      USERSPACE  dev=271581186  ino=30027059  perms=0x01  /usr/bin/ffmpeg
      KERNEL     dev=271581186  ino=30027059  perms=0x01
    two_failures_before_it_passed:
      - >
        policy.rs inserted the glibc st_dev (66306) where the eBPF program reads
        the kernel's own s_dev (271581186 = major 259 << 20 | minor 2). Every
        policy lookup missed, so default-deny denied the allowlisted binary too.
        Neither side errors — it presents as 'enforcement works, allowlist does
        not'. This is the SAME hazard already documented for i_rdev and already
        covered by a regression test, repeated in a different field. Fix: all
        dev_t conversion now lives in device_index::glibc_to_kernel_dev().
      - >
        The second run tested a STALE BINARY. `cargo test` builds a separate
        cfg(test) harness and does not refresh target/debug/hwprivacy-lsm; 30
        passing unit tests said nothing about the binary being executed. Fix:
        the acceptance script now runs cargo build itself and prints the
        binary's mtime.
    tooling_added_as_a_result:
      "--dump-policy": "reads the policy map back out of the kernel and prints it beside what userspace intended, so a key mismatch is a 30-second diagnosis instead of a hypothesis"
    phase_3_acceptance_criteria:
    status: "DEFINED 2026-08-05, not yet run. Written BEFORE the test script, deliberately."
    why_defined_first: >
      Costin: "we need to establish first the tests for this phase". Writing the
      criteria before the script stops the script from quietly becoming the
      definition of success — which is how a test ends up asserting whatever the
      code happens to do.
    what_phase_3_claims: >
      The daemon connects to the kernel helper, pushes the allowlist from
      config.toml, and surfaces kernel camera events through the EXISTING
      frontends with no frontend changes.

    a_connection:
      a1: "helper stopped -> hwprivacy-ctl status says 'Connected: no'   [ALREADY VERIFIED 2026-08-05]"
      a2: "helper started with --socket -> ctl says 'Connected: yes' and names the enforcement state"
      a3: "kill the helper -> ctl returns to 'Connected: no' within ~10s, daemon does NOT crash"
      a4: "restart the helper -> daemon reconnects by itself, WITHOUT restarting the daemon"

    b_policy_push:
      b1: "the helper reports applying exactly the exe_path entries from config.toml that have camera = allow"
      b2: "--dump-policy shows firefox-esr's (dev, ino) present in the kernel map"
      b3: "a rule with camera = allow but NO exe_path is logged as a gap, not silently skipped"
      b4: "a rule with a bogus exe_path is reported unresolved AND counted in ctl status — under default-deny that app is being denied and must not be invisible"

    c_event_flow:
      note: "This is the actual point of Phase 3 — everything else is plumbing."
      c1: "a denied camera open appears in `hwprivacy-ctl log`"
      c2: "the same event appears in the TUI Events panel"
      c3: "the same event appears in the GUI Events tab"
      c4: "a desktop notification appears, informational only (NO action buttons), and its text warns that call audio may also stop"
      c5: "blocked-attempts in ctl status rises by the TOTAL opens (13 for a Firefox session), not by 1 — the coalesced burst must not under-count"

    d_enforcement_regression:
      d1: "firefox-esr, allowlisted via config.toml, CAN use the camera"
      d2: "a binary that is not allowlisted (ffmpeg) is denied"
      d3: "stopping the helper restores camera access immediately"

    e_non_interference:
      e1: "the PipeWire layer keeps working — mic/monitor events still logged as before"
      e2: "daemon NRestarts stays 0 — no repeat of the D-Bus bus-name crash loop"

    known_gaps_this_test_will_NOT_cover:
      - "The GUI/TUI checks (c2, c3) are visual and cannot be asserted by a script — they need Costin's eyes."
      - "c4 is visual too: whether a notification actually appeared, and whether its wording reads right."
      - "Nothing here tests the audio path. Audio is Phase 5 and is deliberately untouched."

  phase_4_stage_1_verified_2026_08_19:
    what: "The kernel allowlist now survives a helper restart, and a reboot."
    mechanism: >
      hwprivacy-lsm --policy-cache. The HELPER owns the file, not the daemon:
      the daemon is unprivileged and /var/lib is root-owned, so having root read
      a user-writable path would add a TOCTOU surface for no benefit.
    stores_paths_not_inodes: >
      An inode is what the kernel matches on, but it changes when the package
      manager replaces a binary. A cache of inodes would silently stop matching
      Firefox after an update — the hardest possible failure to notice. Paths
      are re-resolved on every load.
    verified_write: "policy set by daemon -> /var/lib/hwprivacy/policy contains /usr/lib/firefox-esr/firefox-esr"
    verified_reload: >
      Helper restarted with --policy-cache and deliberately NO --socket, so the
      daemon could not connect and could not quietly repair anything. Result:
      'loaded 1 allowlist entr(ies)', and userspace and kernel agreed exactly —
      dev=271581186 ino=30287776, the Firefox-ESR inode confirmed earlier the
      same evening. Camera restored on exit; still never pinned.
    why_the_absence_matters: >
      Same reasoning that settled D1: prove it by what is ABSENT. With a socket
      present you can never rule out the daemon having fixed things behind the
      test.

  test_harness_race_2026_08_19:
    what: "A --policy-cache test failed twice and the product was not at fault."
    cause: >
      The script killed the running helper while the daemon was mid-push, so
      SetPolicy arrived at a helper that was already shutting down. The main
      loop was gone, the reply channel dropped, and the cache code never ran.
    two_things_that_hid_it:
      - "The script wrote the helper's log to a mktemp dir and deleted it in the EXIT trap — destroying the one artifact that would have shown 'policy set by daemon' never appearing. A summary chosen in advance only helps if you already guessed what mattered."
      - "socket.rs reported RecvTimeoutError::Disconnected as 'timed out waiting for the enforcement thread'. A 0.22s disconnect read as a 5s timeout and sent the investigation after slow I/O that did not exist. Now says which of the two it is."
    the_pattern: >
      Four instruments failed tonight while the product behaved correctly: a
      grep for a log line suppressed by --json, two `pkill -f` patterns that
      matched the checking shell itself, and this race. Assertions on log TEXT
      and on process-name patterns are the recurring shape. Prefer asserting on
      STATE — does the socket exist, does the map hold the key, is the open
      denied.

  c5_closed_2026_08_19:
    status: "CLOSED. Measured, defect found, fixed, and re-verified against a live kernel."
    why_it_was_unverifiable_before: >
      The test asked a human to start a video call in a browser that was
      ALLOWLISTED, so nothing was denied and the counter could not move. It
      also asserted only `delta >= 10`, which would have passed the very bug it
      existed to catch.
    how_it_was_measured: >
      A deterministic burst from one unprivileged process opening /dev/video0 N
      times inside the coalescing window. No browser, no notification, no human
      as the sensor. Two independent sources compared: the helper's own --json
      output (kernel truth) against Blocked attempts over D-Bus (daemon belief).
    the_defect: >
      A burst summary carries pid 0 and accounts for opens the kernel already
      suppressed. It fell through to log_event(), which increments
      blocked_count itself for a Denied action, on top of the additional_opens
      it was reporting. A 13-open denied burst counted as 14. It also wrote a
      second, pid-0 DENIED row into the user-visible event log for a session
      with only one real access.
    measured_before_fix:
      - "13 opens denied -> kernel reported 13, daemon counted 14"
      - "reproduced 3x; a constant +1, never proportional"
    measured_after_fix:
      - "opens 1 -> kernel 1, daemon 1"
      - "opens 5 -> kernel 5, daemon 5"
      - "opens 13 -> kernel 13, daemon 13"
      - "opens 27 -> kernel 27, daemon 27"
      - "headless Chrome (real browser) -> kernel 2, daemon 2"
      - "event log: 4 bursts -> 4 rows, not 8"
    regression_guard: "tools/camera-accounting-check, plus 4 unit tests in lsm_client"

  d1_closed_2026_08_19:
    status: "CLOSED. Proven both directions with the user's own Firefox-ESR, seen on screen."
    subject: "Firefox-ESR /usr/lib/firefox-esr/firefox-esr, inode 30287776. Agreed as THE test browser."
    allow_direction:
      config: 'firefox camera = "allow"'
      kernel: "denied=False, 13 opens (1 event + burst_summary +12)"
      observed: "live video in the call"
    deny_direction:
      config: 'firefox camera = "deny"  (one line changed, nothing else)'
      preconditions_verified_first: >
        Allowed binaries dropped to 0, the helper independently logged
        'policy set by daemon - 0 allowed', no process held /dev/video*, and a
        probe confirmed 3/3 denied seconds before the test. So a retained fd
        and a policy that never landed were BOTH excluded in advance.
      kernel: "denied=True, 4 opens (1 event + burst_summary +3), same inode 30287776"
      observed: "WhatsApp: 'Camera or microphone not found'. No video content."
    why_the_app_blames_the_microphone_too: >
      getUserMedia({audio, video}) fails as a unit, so a camera-only denial
      reads to the app as both devices missing. Predicted from the 2026-08-05
      WhatsApp measurement and reproduced exactly.
    what_had_made_it_look_broken:
      - "Retained fd: the hook is on open(), not read. A camera opened BEFORE enforcement starts keeps working. The test harness now refuses to run while anything holds /dev/video*."
      - "Two Firefox builds: ~/firefox-developer/firefox-bin is inode 1312111 and was never allowlisted, while config.toml reads 'firefox: camera allow'. Calls from Developer Edition are correctly denied and look like a bug."
      - "PipeWire microphone prompts fire during a video call, duplicated (b3), from the old untrusted layer — easily read as the tool misbehaving."

  b5_helper_stops_accepting_clients:
    severity: critical
    status: "FIXED 2026-08-19 22:20, with a regression test proven to fail on the old code. Supersedes the earlier 'reconnect delay' entry, which described the SYMPTOM."
    root_cause: >
      handle_connection() spawned a per-connection events thread that parked in
      recv() on the broadcast channel. That channel's sender is owned by
      SocketServer and lives as long as the process, so recv() NEVER returns
      Err. The unconditional events_handle.join() at the end of the function
      therefore blocked forever, the accept loop never ran again, and the log
      printed "client disconnected" on the way into the wedge — which is why
      the logs looked like a clean disconnect rather than a hang.
    why_it_looked_intermittent: >
      An incoming camera or mic event unblocked recv(), let the join finish and
      the accept loop resume. On a quiet system nothing arrived and it hung
      indefinitely. That is the whole of the "~51 second reconnect delay".
    fix: >
      The events thread now polls with recv_timeout and an AtomicBool stop flag,
      so it exits within 200ms of the connection ending and releases the mutex
      for the next client. A failed accept() no longer breaks the loop either —
      one transient error must not turn the socket permanently deaf.
    regression_test: >
      socket::tests::a_second_client_is_accepted_after_the_first_disconnects —
      connects, disconnects, connects twice more. Verified to FAIL (5.07s, read
      timeout) against the reintroduced bug and pass against the fix. A test
      that passes on both is worthless, so this was checked rather than assumed.
    what: >
      After its first client disconnects, hwprivacy-lsm does not reliably accept
      the next one. The daemon's connect() succeeds — a unix socket reports
      ESTAB as soon as it is in the listen backlog — so the daemon believes it
      is connected and blocks waiting for a reply that can never arrive.
    evidence_2026_08_19: |
      helper journal, whole boot:
        client connected    (uid=1000 gid=1000 pid=2086)
        policy set by daemon — 1 allowed
        client disconnected (uid=1000 gid=1000 pid=2086)
        <no further 'client connected' — ever>
      daemon (pid 15490) logged 'connected to /run/hwprivacy/lsm.sock' and the
      two config gaps, then nothing. `ss -x` showed its socket ESTAB.
      Still hung 4 minutes later; a config change could not be pushed at all.
    where: "hwprivacy-lsm/src/socket.rs — single accept thread; handle_connection() blocks it until that client leaves."
    why_it_looked_like_a_delay: >
      Earlier the same evening this presented as a ~51s pause before a policy
      push landed, and was recorded as 'reconnect delay, observed not
      diagnosed'. It is not a delay and not a retry interval — it is a stuck
      accept, which sometimes clears and sometimes does not.
    impact: >
      A daemon restart can leave the kernel layer permanently unreachable until
      the HELPER is restarted. Enforcement continues from the last pushed
      policy, so the machine stays protected — but config changes silently do
      not take effect, which is the worst kind of failure for a policy tool.
    do_not_guess: >
      Two candidate causes, untested: the accept loop exiting on an Err from
      listener.incoming(), or the queued connection being lost when
      handle_connection returns. Instrument the accept loop before changing it.
    fix_shape: >
      Accept must not be gated on the previous client finishing. Either accept
      on its own thread and hand connections off, or handle clients
      concurrently. Whatever the shape, the helper must log every accept AND
      every accept error — the absence of a log line is what made this
      invisible for hours.

  reconnect_delay_observed_2026_08_19:
    severity: medium
    superseded_by: "b5_helper_stops_accepting_clients — this entry described the symptom; that one has the cause."
    what: "After a daemon restart the policy push took ~51s, not the ~10s RECONNECT_SECS implies."
    evidence: "daemon 805082 logged 'connected' at 20:11:39; '1 executable(s) allowed' only at 20:12:30. Seen at least twice."
    why_it_matters: >
      For that window the helper keeps enforcing the PREVIOUS policy. Denying
      longer than expected is harmless; GRANTING later than expected is not —
      restart the daemon to allow an app and it stays denied for up to a
      minute with no indication. A plausible contributor to the original D1
      confusion, where a restart sat between the deny and allow steps.
    status: "observed, not diagnosed. Do not guess — instrument the connect/push path."

  b1_scope_correction_2026_08_19:
    finding: >
      b1 is narrower than every doc states. Dismissing writes a permanent deny
      only on the PLAIN `ask` path. On `ask_each` the per-stream branch calls
      grant_one_shot() or logs StreamDenied and NEVER calls config.set_rule().
    evidence: >
      Four mic prompts were dismissed during the 2026-08-19 call with firefox
      microphone = ask_each; config.toml was unchanged, mtime untouched, all 8
      rules identical.
    still_dangerous: >
      default_action = 'ask', so any app WITHOUT a rule is on the writing path.
      The defect is real; its blast radius is smaller than 'dismissing a
      notification writes a permanent deny rule' implies.

  d1_mechanism_proven_2026_08_19:
    status: "The MECHANISM is proven. Firefox specifically is still untested."
    evidence: >
      With Chrome allowlisted by inode (exe_path = /opt/google/chrome/chrome):

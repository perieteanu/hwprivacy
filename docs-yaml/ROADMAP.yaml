answered_2026_08_21:
  q-posture:
    question: "deny-by-default or ask-by-default?"
    answer: "DENY-BY-DEFAULT."
    consequence_accepted: >
      An app with no rule is denied and gets the instant BLOCKED notification,
      which has no action buttons — granting means hwprivacy-ctl, the TUI or the
      GUI. `ask` still works and is now opt-in per rule. Discovery moves to the
      notification plus the persistent history table.
  q-dismiss-semantics:
    question: "When the user dismisses a rule prompt without choosing, what should happen?"
    answer: "(a) block this attempt, save nothing, cooldown, ask again later."
    note: "The cooldown machinery already existed and was simply unreachable. It now runs, and policy.dismiss_cooldown_secs replaces the const."
  q-kernel-baseline-allowlist:
    question: "Does the shipped default allowlist pipewire and wireplumber for the camera?"
    answer: "YES, both — plus a preset mechanism for everything above that baseline."
    why_it_is_not_a_concession: >
      With pipewire denied, the PipeWire camera route does not exist at all —
      the camera vanishes from hwprivacy-ctl devices and layer 1's camera
      feature is dead. Allowing the servers hands that route back to layer 1,
      which can attribute it PER APPLICATION, something layer 2 structurally
      cannot do. The two layers then cover one route each:
        app -> PipeWire -> camera : layer 1, by application name, weaker
        app -> V4L2 -> /dev/video0: layer 2, by executable inode, stronger
      Firefox and Chrome are on the second row.
    not_yet_implemented: "See next_up > presets."


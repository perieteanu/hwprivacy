# Architectural decisions. Append, never rewrite. Supersede by linking ids.
# Entries dated 2026-03/04 are RECONSTRUCTED from code + PLAN.md, not from a
# contemporaneous record — they are marked reconstructed: true.
---
decisions:
  - id: d-pipewire-graph-level
    date: "2026-03-27"
    reconstructed: true
    title: "Enforce at the PipeWire graph level, not per-application"
    context: >
      XDG Portals only gate sandboxed apps. Native .deb apps have no permission
      layer at all. Hooking individual applications does not scale and breaks
      on every update.
    decision: "Police PipeWire links. Every audio/video device flows through PipeWire, so one chokepoint covers all packaging formats."
    consequences:
      - "Works for Firefox, Telegram, Chromium, OBS, anything — no per-app work."
      - "Identity is limited to what PipeWire exposes (see d-identity-by-pw-name)."
      - "Cannot see inside a browser: one client, many tabs (answered by d-per-stream-gating, formerly d-two-layer-model)."
    scope_correction_2026_08_04:
      finding: >
        The premise 'every audio/video device flows through PipeWire' is FALSE
        and was never tested. Demonstrated by experiment: direct V4L2 camera
        access and direct ALSA microphone capture are both entirely invisible.
      corrected_claim: "Covers all packaging formats THAT USE PIPEWIRE — a much smaller claim than the original."
      what_survives: >
        The decision is still right for the playback-monitor feature, where
        PipeWire is genuinely the only sensible layer. It is wrong as a
        universal chokepoint argument.
      ref: "ROADMAP.yaml > security_gaps > g5_camera_bypass, g6_alsa_bypass"

  - id: d-poll-pw-dump-v1
    date: "2026-03-27"
    reconstructed: true
    title: "v1 monitoring substrate: poll `pw-dump` as a subprocess"
    context: >
      pipewire-rs native bindings were judged too much surface for a first
      version. pw-dump emits the whole graph as JSON and is trivially parseable.
    decision: "Poll pw-dump every poll_interval_ms (default 500), diff link IDs, act on new links."
    accepted_costs_at_the_time:
      - "~500ms race window where audio can flow before the link is destroyed."
      - "Continuous subprocess + JSON parse overhead."
    measured_reality_2026_08_04:
      - "272 KB JSON per call, 2 calls/sec, 1.2% of a core at idle, 20.7 MB RSS."
      - "Costin's verdict: 'the price of 1.2% of a core is very generous. i wouldnt pay such a price.'"
    status: "SUPERSEDED IN INTENT by d-event-driven-substrate. Still the shipped code."

  - id: d-per-stream-gating
    superseded_by: d-no-per-stream-grants
    superseded_on: "2026-08-23"
    renamed_from: d-two-layer-model
    renamed_on: "2026-08-19"
    rename_reason: >
      'Two-layer' was ambiguous after the 2026-08-04 kernel pivot. HERE it has
      always meant app-rule + per-stream gating, a BROWSER-TAB problem entirely
      inside the PipeWire layer. It does NOT mean PipeWire + kernel — that is
      d-kernel-lsm-layer. This entry predates the kernel layer by four months.
    date: "2026-03-27"
    reconstructed: true
    title: "Per-stream gating to solve the browser problem (was: two-layer permission model)"
    context: >
      A browser is a mini OS: one 'Firefox' PipeWire client serves dozens of
      tabs. An app-level allow would grant every tab forever.
    decision: >
      Layer 1 = per-app rule. Layer 2 = per-stream gating via the `ask_each`
      permission, which prompts on every new PipeWire node (each tab requesting
      mic/camera creates its own node).
    consequences:
      - "Browsers get real per-tab gating without browser integration."
      - "Requires one-shot grants keyed on a stream identifier — see d-oneshot-keyed-on-node-id."

  - id: d-monitor-tap-by-link-direction
    date: "2026-03-27"
    reconstructed: true
    title: "Detect playback eavesdropping by link direction, not by node naming"
    context: >
      Recording what the speakers are playing is the least-defended privacy
      hole on Linux, and monitor sources are not consistently named.
    decision: >
      Register every Audio/Sink as a Monitor-category protected device, then
      treat 'Audio/Sink (output) -> Stream/Input/Audio (input)' as a tap.
      Normal playback is the opposite direction and is never touched.
    rationale: "Direction is structural. Naming is not — some setups expose an explicit *.monitor node, some do not."
    validation: "Tested live during Phase 1: parecord captured 0 bytes (44-byte empty WAV) while Firefox playback kept running."

  - id: d-identity-by-pw-name
    date: "2026-03-27"
    reconstructed: true
    superseded_scope: "partially, by d-identity-proc-enrichment"
    title: "App identity = PipeWire application.name"
    decision: "Match rules against the application.name property reported by PipeWire."
    known_weakness: "A hostile app can set this property to anything. Accepted for v1 — see MISSION.yaml threat_model."

  - id: d-identity-proc-enrichment
    date: "2026-04-06"
    title: "Enrich identity from /proc, and annotate with the cgroup unit"
    context: >
      pipewire-pulse bridge clients carry thin node-level identity; many nodes
      reported pid:0 because only the string form of the pid prop was handled.
    decision: >
      Fall back node props -> owning client props; prefer server-attested
      pipewire.sec.pid; accept the pid as JSON number OR string; add
      /proc/<pid>/exe and /proc/<pid>/cgroup as identity fallbacks; append the
      cgroup unit as a ' [unit]' annotation on the label.
    consequences:
      - "Labels became e.g. 'Firefox [pipewire-pulse]'."
      - "Forced d-normalize-strips-bracket-suffix so rules stay writable as 'firefox'."
      - "Notification bodies still render '(pid:N)' separately, which normalization does NOT strip — this is the dead-rule trap."

  - id: d-normalize-strips-bracket-suffix
    date: "2026-04-07"
    title: "Rule matching normalizes: lowercase + strip one trailing ' [...]'"
    decision: "normalize_app_name() strips a trailing bracketed annotation only when the string ends with ']', then lowercases."
    rationale: "Lets the binary name `obs`, the PipeWire name `OBS`, and the bridge variant `OBS [pipewire-pulse]` share one rule."
    deliberate_limit: "Narrow by design. Not a fuzzy matcher."
    unintended_consequence: >
      A rule pasted from a notification body ends with ')' not ']', so nothing
      is stripped and the rule can never match. One such rule
      ('Firefox [pipewire-pulse] (pid:2332)') sits dead in the live config.

  - id: d-oneshot-keyed-on-node-id
    date: "2026-03-27"
    reconstructed: true
    title: "One-shot ask_each grants are keyed on the PipeWire node id"
    decision: "StreamTracker.one_shot_allowed: Vec<u32> of approved node ids; evaluate() short-circuits to Allow on a hit."
    defect_found_2026_08_04:
      - "The Vec is never pruned — a grant lives for the daemon's whole lifetime."
      - "PipeWire recycles node ids, so an unrelated later stream inherits the grant."
      - "Live evidence: an `ask_each` Firefox mic stream logged ALLOWED with no prompt."
    verdict: "This is a correctness AND security bug, not a tuning issue. Grants must expire when the node disappears."
    fixed_2026_08_21:
      what: "Grants are now a HashMap<node_id, normalised app name>, pruned every poll against the live node set."
      why_the_app_name_is_part_of_the_key: >
        Pruning alone leaves a race: an id can be freed and reused between two
        polls. Requiring the app name to match closes the cross-application
        case, which is the half that matters for security.
      the_name_that_hid_it: >
        StreamInfo's field was called object_serial while policy_engine assigned
        node.id to it. object.serial is monotonic and never reused; a node id is
        reused freely. Renamed to node_id — this title is now literally correct
        rather than accidentally so.

  - id: d-clients-are-viewers
    date: "2026-03-27"
    reconstructed: true
    title: "Only the daemon enforces; ctl/tui/gui are pure D-Bus viewers"
    decision: "All policy state lives in the daemon. Frontends hold no authority and no cache of record."
    consequences:
      - "Any frontend can be killed without weakening enforcement."
      - "Three frontends stayed cheap to build (196 / 498 / 598 LOC)."
      - "Frontends poll, because the interesting signals are never emitted — see d-signals-declared-not-emitted."

  - id: d-signals-declared-not-emitted
    date: "2026-03-27"
    reconstructed: true
    title: "AccessAttempt and StreamEvent were specified but never wired up"
    status: "UNRESOLVED DEFECT, recorded here because README documents them as working API"
    reality: "Only RuleChanged is emitted (from SetRule/RemoveRule). TUI polls at 1s, GUI at 2s."
    cost: "Every frontend does 5 D-Bus round-trips per tick against a lock the monitoring loop also wants."

  - id: d-user-service-not-system
    date: "2026-03-27"
    reconstructed: true
    title: "systemd USER service on the session bus, never root"
    decision: "Daemon runs as the user, registers org.hwprivacy.Daemon on the session bus, with D-Bus activation as a fallback start path."
    rationale:
      - "PipeWire is per-session; a system daemon would be talking to the wrong graph."
      - "No privilege escalation, no setuid, no polkit."
    accepted_cost: >
      A process running as the same user can stop the daemon. This caps the
      threat model permanently — it is a property of the design, not a bug.

  - id: d-dismiss-defect
    date: "2026-08-04"
    title: "Notification dismiss writes a permanent deny (defect, recorded not decided)"
    context: >
      notification.rs ends with `perm.or(Some(Permission::Deny))`, so
      ask_user_permission() can never return None. The `None =>` cooldown arm
      in main.rs is unreachable, and record_dismiss()/is_in_cooldown() are dead.
    evidence: |
      journalctl, 2026-08-04 18:47:04:
        INFO notification: Notification dismissed — no rule saved, will ask again later
        INFO hwprivacy_daemon: User set rule: pipewire [pipewire-pulse] → Monitor = deny
    impact: >
      Every prompt the user ignored silently became a permanent deny rule. This
      is the primary reason the app 'did not work properly' in daily use — the
      config drifted into decisions the user never made.
    decision_needed: "RESOLVED 2026-08-21 — see d-dismiss-saves-nothing."

  - id: d-posture-unsettled
    date: "2026-08-04"
    title: "OPEN: deny-by-default vs ask-by-default"
    context: >
      README states 'Default policy: deny all'. The live config ships
      policy.default_action = 'ask'. The code honours the config. Combined with
      d-dismiss-defect, the effective behaviour was 'prompt, then deny whatever
      you ignored' — the worst of both.
    options:
      deny_by_default:
        pro: "matches the stated mission; silent; nothing leaks while you are away from the keyboard"
        con: "apps break with no explanation until an allow rule is added by hand"
      ask_by_default:
        pro: "discoverable; the prompt teaches you what is asking"
        con: "prompt fatigue; every unanswered prompt is a decision deferred"
    status: "SETTLED 2026-08-21 — see d-deny-by-default."

  - id: d-event-driven-substrate
    date: "2026-08-04"
    title: "LAYER 1 ONLY, DEFERRED: replace polling with an event-driven PipeWire substrate"
    scope_note_2026_08_19: >
      This entry applies to the PipeWire layer alone and is NOT the project's
      current direction. It was written at 22:38 on 2026-08-04, two minutes
      after the kernel pivot was logged and seventeen minutes before the first
      kernel design decision — so it is the last word on a layer that had just
      stopped being the whole project. Being last in this file made it read as
      'what we are doing next', which it is not. Current direction is
      d-kernel-lsm-layer; nothing here has been implemented.
    context: >
      Three separate complaints turned out to be one root cause. Polling
      pw-dump produces (a) 1.2% idle CPU, (b) the ~500ms race window, and
      (c) the grandfathering hole where links already present when the daemon
      starts are seeded into known_link_ids and never evaluated.
    decision: >
      Move to pipewire-rs native bindings with registry global add/remove
      callbacks. Keep policy_engine, config, D-Bus, and all three frontends
      unchanged — the policy layer is already decoupled from the monitoring
      layer, which is what makes this swap affordable.
    why_this_fixes_all_three:
      - "idle cost: no subprocess, no periodic 272 KB parse — cost approaches zero when nothing happens"
      - "race window: notification arrives on link creation instead of up to 500ms later"
      - "grandfathering: connecting to the registry enumerates EXISTING objects, so startup evaluation is free rather than an extra pass"
    rejected_alternative_1:
      what: "raise poll_interval_ms"
      why_rejected: "already a config knob, needs no code — but it buys CPU by widening the race window. Wrong trade for a security tool."
    rejected_alternative_2:
      what: "WirePlumber Lua policy hook"
      why_rejected_for_now: >
        Genuinely better (blocks BEFORE the link exists, so zero data ever
        flows) but couples the project to WirePlumber's policy chain and its
        version churn. Keep as the v2/v3 goal after pipewire-rs lands.
    status: "DEFERRED. Still no code as of 2026-08-19. Applies to layer 1; does not block or describe the kernel layer."

  - id: d-kernel-lsm-layer
    date: "2026-08-04"
    title: "PIVOT: add a kernel eBPF LSM layer beneath PipeWire; both layers stay"
    written_up: "2026-08-19"
    written_up_note: >
      Backfilled. The pivot happened on 2026-08-04 at 22:37 and was carried out
      over the following day, but no ADR was ever written — MISSION.yaml,
      ARCHITECTURE.yaml and DECISIONS.yaml were all last touched at 22:37-22:38,
      before the first kernel design decision (22:40) and before the first line
      of kernel code (22:55). For fifteen days this file recorded why the old
      basis was wrong without recording what replaced it.
    context: >
      d-pipewire-graph-level rested on the premise that every audio/video device
      flows through PipeWire. That premise was never tested and is false. Two
      experiments on the live system settled it:
        ffmpeg -f v4l2 -i /dev/video0  -> 90 frames captured, 0 events logged
        ffmpeg -f alsa -i hw:0,0       -> 3s of mic audio,    0 events logged
      Firefox and Chrome take the camera through V4L2 directly. No PipeWire node,
      no link, nothing for the link-diff substrate to see. Not 'allowed', not
      'missed' — structurally unobservable. Unfixable in the PipeWire layer.
    decision: >
      Add a second enforcement layer below PipeWire: an eBPF LSM program on
      security_file_open, denying open() of camera (major 81) and ALSA (major
      116) device nodes with -EPERM. A root helper (hwprivacy-lsm) owns the BPF
      maps and serves an NDJSON unix socket; the existing user daemon connects
      as a client and pushes policy. Both layers stay. Neither is sufficient
      alone.
    why_both_layers:
      - "Kernel sees the camera but cannot attribute the microphone: /dev/snd is held by /usr/bin/pipewire, so the kernel cannot tell which app is behind it."
      - "PipeWire knows the app ('Firefox wants the mic') but is blind to the camera entirely."
      - "The playback-monitor feature has no kernel equivalent — there is no straightforward way to tap a sink monitor below PipeWire. That feature is the reason layer 1 is not merely legacy."
    implementation:
      new_crates:
        hwprivacy-lsm:   "root helper + the BPF C program. ~2434 LOC."
        hwprivacy-proto: "NDJSON wire protocol, serde only, so the root process links no D-Bus stack. ~271 LOC."
      daemon_side: "lsm_client.rs — connects, reconnects, pushes the allowlist, receives kernel events. ~362 LOC."
      unified_rule: "AppRule.exe_path governs BOTH layers. One rule, two enforcement points. Only `allow` + a present exe_path reaches the kernel map."
      frontends: "Unchanged. Kernel events reach ctl/tui/gui through the existing D-Bus surface."
    measured:
      hook_cost: "+13.75 ns per open(), 95% CI [+7.3, +20.2] — 1.88% of a 733 ns open(), and 0% at idle."
      contrast: "The PipeWire poll burns 1.2% of a core continuously, at idle, forever. Costin rejected that price; this one he did not."
    proven:
      phase_1: "observe-only LSM — validated live, attached first try."
      phase_2: "camera enforcement — acceptance 5/5; denied live against Firefox and WhatsApp; access restored on detach."
      phase_3: "daemon integration — 11/13. Connection, reconnect without restarting the daemon, policy push, gap reporting, enforcement, event flow to all three frontends, restore on detach, no interference with layer 1."
    not_proven:
      - "C5 burst counting — the test as written cannot verify it; the only denied app does not burst."
      - "D1 — a call failed although firefox-esr was allowlisted. Two untested hypotheses, see HANDOFF.md."
    consequences:
      - "Enforcement cannot revoke an ALREADY-OPEN fd. The hook fires on open(), not on read. Costin saw live camera video with enforcement on because Firefox held the descriptor from earlier. Same class as g1/g2 in layer 1. A real limitation, not a bug — but it must be stated wherever the camera feature is described, because 'I enabled blocking and still saw video' is exactly how someone concludes the tool is broken."
      - "Nothing is enforced at the kernel layer at rest. No systemd unit exists (Phase 4), the BPF program is never pinned, and killing the helper detaches it and restores normal access."
      - "Kernel denials use an informational notification with NO action buttons — deliberately. Routing them through the action path would inherit b1 (dismiss writes a permanent deny) on day one."
      - "Identity is now (dev, ino) of the executable, not a self-declared name. /usr/bin/firefox is a shell script; the real binaries are /usr/lib/firefox-esr/firefox-esr and ~/firefox-developer/firefox-bin, and they are different policy keys. That is the feature, not a bug."
      - "Two dev_t encodings — glibc's and the kernel's — are a live trap. Decoding one with the other's rules yields major 0 and silently matches nothing while unit tests pass. This bit twice. All conversion now lives in device_index::glibc_to_kernel_dev()."
      - "Audio enforcement at the kernel layer is agreed in principle and NOT started (Phase 5). Denying major 116 outright would deny /usr/bin/pipewire itself, which is every app's mic path."
    rejected_alternative_1:
      what: "Aya (pure-Rust eBPF) instead of libbpf-rs + one C file"
      why_rejected: "Keeping the C minimal — no loops, no unbounded reads — is what keeps the verifier happy. libbpf+C is the conservative path for a program that must load on a stock Debian kernel."
    alternatives_named_but_not_argued:
      what: "AppArmor profiles and device-node ACLs, both listed in MISSION.yaml > what_would_fix_it"
      honest_note: >
        No contemporaneous rejection rationale was recorded for either. They were
        named as candidates and eBPF was chosen; do not reconstruct a reason that
        was never written down. If this is ever revisited, the argument still has
        to be made.
    supersedes_in_scope: "d-pipewire-graph-level — see its scope_correction_2026_08_04. That decision survives for the playback monitor and is wrong as a universal chokepoint argument."
    do_not_confuse_with: "d-per-stream-gating (formerly d-two-layer-model, 2026-03-27) — that 'two layers' means app-rule + per-stream gating inside PipeWire, a browser-tab problem, and predates this pivot by four months."
    status: "Phases 1-3 landed and substantially proven. Phase 4 (systemd unit for the helper) and Phase 5 (audio backstop) not started. This is the project's current direction."

  - id: d-per-microphone-identity
    superseded_by: d-one-device-one-prompt
    superseded_on: "2026-08-23"
    date: "2026-08-19"
    title: "Two mic prompts are CORRECT — they are two microphones. Label them, do not coalesce."
    context: >
      b3 was recorded as "duplicate prompts": a stereo capture produced two
      identical BLOCKED popups and two identical rule prompts, and the
      prescribed fix was to coalesce new links by (app node, device category)
      before deciding or notifying.
    the_thing_that_was_missed: >
      Those two links are not duplicates. This laptop has TWO PHYSICAL
      MICROPHONES, presented by ALSA as one stereo capture device, and PipeWire
      exposes them as separate ports: capture_FL (left) and capture_FR (right).
      Each link carries its own port id, which PwLink already records as
      output_port and which classify_link() has simply never looked at.
      Coalescing would have destroyed the only handle on which microphone is
      being asked for.
    decision: >
      Keep one prompt PER MICROPHONE. b3 is not a duplication bug, it is a
      LABELLING bug: two prompts for two different microphones is right, two
      prompts both saying "Microphone" is what reads as broken. The fix is to
      resolve the port to a human name and say which mic is being requested.
    measured_2026_08_19: |
      Cutting one channel's link mid-capture, with the daemon's own
      `pw-link --disconnect`:
        window     LEFT rms   RIGHT rms
         0- 6s      ~9000      ~8800     both live
         6-14s     ~13000        0.0     right silent, left alive
      parecord kept running throughout and never noticed.
    consequences:
      - "Per-microphone permission is viable, cleanly, with machinery the daemon already has."
      - "b3's fix_shape in ROADMAP is WRONG as written and must not be implemented as coalescing."
      - "Whatever renders a prompt must name the microphone, or the user cannot tell which of two identical dialogs to answer."
      - "The offenders table will need the same distinction, or two mics collapse into one row."
    open_question_CLOSED_2026_08_19: >
      "Which mic is physically left?" was not answered — it was made
      irrelevant. Costin's ruling: do not use left/right at all. Name them
      mic1..micN and cam1..camN, ordinals only, unless the device publishes its
      own name. An ordinal claims only "the first one", which is true by
      construction; "left" is a claim about the chassis that we never verified.
      See CONVENTIONS.yaml > multiple_devices_of_one_kind for the naming rule
      and, critically, the stability constraint: the ordinal must come from a
      key that survives a reboot (port NAME, not port id) or a rule silently
      migrates to a different microphone.

  - id: d-deny-by-default
    date: "2026-08-21"
    title: "SETTLED: deny by default"
    supersedes: d-posture-unsettled
    context: >
      README claimed "Default policy: deny all" while the shipped config said
      default_action = "ask", and the code honoured the config. Combined with
      d-dismiss-defect the effective behaviour was "prompt, then permanently
      deny whatever you ignored" — the worst of both. Unresolved since
      2026-08-04.
    decision: "policy.default_action defaults to `deny`. An app with no rule is denied."
    consequences:
      - "The `ask` path still exists and is unchanged. It is now opt-in per rule rather than the fallback for everything unknown."
      - "A new app breaks with an instant BLOCKED notification that carries NO action buttons; granting means hwprivacy-ctl, the TUI or the GUI."
      - "Discovery moves to that notification plus the persistent history table. Deny-by-default without a visible denial would be indistinguishable from broken hardware."
      - "b1's blast radius shrinks: with no `ask` fallback, the rule-writing prompt only fires for rules explicitly set to ask/ask_each."
      - "Existing configs that name default_action are unaffected. A config that OMITS it flips from ask to deny on upgrade — deliberate, and the direction that fails closed."
    note_on_what_did_not_change: >
      `ask` already destroyed the link BEFORE prompting ("security first",
      main.rs). So `ask` and `deny` were always both fail-closed; the only
      difference is whether a prompt follows. This decision changes the default,
      not the enforcement mechanism.

  - id: d-dismiss-saves-nothing
    date: "2026-08-21"
    title: "A dismissed prompt writes nothing, cools down, and asks again"
    supersedes: d-dismiss-defect
    decision: >
      Option (a) of q-dismiss-semantics: block this attempt, save no rule, stay
      quiet for policy.dismiss_cooldown_secs, ask again after it.
    implementation: >
      ask_user_permission() returns PromptOutcome — Chosen / Dismissed / Failed
      — instead of Option<Permission>. notification::decide() maps an outcome to
      a PromptAction, and SavePermanentRule is reachable ONLY from Chosen.
    why_a_pure_function_and_not_an_inline_match: >
      The invariant ("nothing but a button press may be saved") previously lived
      inside a tokio::spawn where no test could reach it, and it was wrong for
      months while reading correctly. Same reason denied_opens() was extracted
      from handle_event() after the C5 accounting bug. If a rule can only be
      written through one pure function, that function can be tested
      exhaustively — and it is.
    third_state_was_not_optional: >
      The error paths returned Some(Deny) as well, so on a headless session or
      with no notification daemon EVERY prompt became a permanent deny rule.
      That is why the enum has three variants and not two: "we could not ask" is
      a different fact from "the user closed it", even though both must write
      nothing.
    regression_guard: >
      tools/doc-check now carries SENTINELS — source patterns that must not
      reappear. `perm.or(Some(Permission::Deny))` is the first entry. A fix that
      outlives the person who remembers why needs a check, not a comment.

  - id: d-policy-fingerprint
    date: "2026-08-21"
    title: "The daemon re-pushes kernel policy when the world moves under it"
    context: >
      Found by reading the live journals, not the code. On 2026-08-20 dpkg
      upgraded firefox-esr two minutes after the daemon pushed policy. The path
      was unchanged, the inode was not, and the kernel map kept the old key —
      so an allowlisted Firefox was denied the camera for sixteen hours while
      config.toml said `allow` and hwprivacy-ctl status said "Allowed
      binaries: 2". It repaired itself at the next reboot, which is exactly why
      nobody had ever seen it.
      Reading the code for that surfaced a second, worse one: SetPolicy was sent
      only at connect time, so a camera rule changed from the CLI, the TUI or
      the GUI never reached the kernel at all until a restart.
    decision: >
      The lsm_client session loop selects over incoming replies and a recheck
      tick. Each tick fingerprints the INTENDED allowlist — (exe_path, dev, ino)
      per entry, sorted, plus the enforcement flag — and re-pushes SetPolicy
      when it differs, naming what moved.
    why_one_mechanism: "All three staleness modes — binary replaced, rule changed, binary deleted — are changes to the same fingerprint."
    knob: "policy.exe_recheck_secs, default 30, 0 disables."
    rejected_alternative_1:
      what: "inotify on the parent directories"
      why_rejected: >
        Near-instant instead of up-to-30s, but needs a new dependency in a
        security tool, against Debian 13's rustc 1.85. Thirty seconds versus
        sixteen hours is a 2000x improvement; the remaining gap does not justify
        the supply chain.
    rejected_alternative_2:
      what: "store (dev, ino) in the policy cache instead of paths"
      why_rejected: "already rejected in Phase 4 for the same reason — an inode cache stops matching Firefox after an update, which is the hardest failure to notice."
    trap_avoided: >
      The daemon's (dev, ino) are glibc-encoded and compared ONLY for change
      detection. Authoritative conversion stays in the helper's
      PolicyKey::from_path, the single caller of glibc_to_kernel_dev(). The two
      encodings differ and mixing them yields major 0, matching nothing, while
      unit tests pass. That has already happened twice here.

  - id: d-executable-is-the-principal
    date: "2026-08-21"
    title: "hwprivacy's identity is the executable. It cannot see inside one."
    context: >
      Measured 2026-08-21: firefox-esr opened the camera twice in one morning
      with no video call. Cause: a website held a standing per-origin camera
      grant and reacquired on tab reload. hwprivacy allowed it correctly — at
      both layers the question asked was "is this firefox-esr?", and it was.
      Costin asked whether website-level permission should become a third layer,
      then ruled it out: the software stays application-agnostic.
    decision: >
      State the limit; do not try to close it. Anything that runs many
      principals inside one executable — a browser's tabs, an interpreter's
      scripts, a shell's children — is ONE principal to hwprivacy.
    evidence_that_it_is_not_a_browser_problem: >
      /usr/bin/python3.13 appears in the live history table with 18 camera
      denials. The interpreter is the principal; the script is invisible. Same
      shape, no browser involved.
    why_not_a_third_layer: >
      Origin identity exists only inside the browser. A "website layer" could
      not enforce alongside the other two — it would be a DELEGATION layer,
      writing policy files that ask the browser to constrain itself, where the
      enforcer and the constrained party are the same program. That is strictly
      weaker than both existing layers, and shipping it as "layer 3" would be
      the kind of overclaim this project has spent days removing from its docs.
    also_rejected: >
      Reading browser permission stores (Firefox permissions.sqlite, Chrome
      Preferences) even read-only. It is per-application coupling to a schema
      nobody owes us stability on — exactly what d-pipewire-graph-level rejected
      in the first place.
    what_is_done_instead: "notify on ALLOWED opens, so a silent grant is at least visible. See ROADMAP > next_up > notify-on-allow."

  - id: d-coalesce-by-category
    superseded_by: d-one-device-one-prompt
    superseded_on: "2026-08-23"
    date: "2026-08-21"
    title: "Two links are duplicates or not depending on the CATEGORY"
    refines: d-per-microphone-identity
    context: >
      d-per-microphone-identity (2026-08-19) ruled that b3's two prompts are two
      physical microphones and must NOT be coalesced. That is right, and it was
      applied as if it were a statement about links in general. Reading the live
      graph on 2026-08-21 showed it is a statement about MICROPHONES:
        node=46 Audio/Source  capture_FL(64) capture_FR(65)
        node=36 Audio/Sink    monitor_FL(61) monitor_FR(63)
      Both look identical in the link diff. They are not the same thing.
    decision:
      microphone: >
        One prompt per port. Two physical microphones, separately gateable —
        measured 2026-08-19, cutting one channel took its rms to 0.0 while the
        other kept recording. Labelled mic1..micN.
      monitor: >
        Coalesce by (device, app). A sink's monitor_FL/monitor_FR are two
        CHANNELS of one playback device; recording what the speakers play is one
        act against one device. Seen live 2026-08-21: two identical
        "OBS -> Monitor -> ALLOWED" rows in the same second.
      camera: "unchanged — one link."
    the_asymmetry_is_the_point: >
      The test for "are these duplicates" is not "do the links look alike", it
      is "can the user meaningfully answer differently for each". For two
      microphones, yes. For two channels of one speaker pair, no.
    invariant: >
      Coalescing the PROMPT must never coalesce the ENFORCEMENT. LinkGroup
      carries every link id and destroy_links() tears down all of them. Had it
      destroyed only the representative, one channel would keep flowing while
      the popup said BLOCKED — worse than the defect it replaces. There is a
      test proven to fail against exactly that mistake.
    ordinal_stability: >
      Ordinals come from the port NAME, sorted. Port ids are allocated per
      session; names persist. Sorting by id would silently move "mic2" to the
      other microphone after a reboot.
    a_test_that_proved_nothing: >
      The first version of the direction-filter test used this laptop's sink,
      where the in-ports are playback_* and the out-ports are monitor_*. Since
      "monitor" sorts before "playback", mixing the two populations produced the
      right ordinals anyway and the test passed with the filter REMOVED. Caught
      by running it against the reintroduced defect, which is the entire reason
      that discipline exists. Rewritten with an in-port that sorts first.
    scope: "Labelling only. Rules remain per CATEGORY; per-device rules stay deferred."

  - id: d-notify-on-allow
    date: "2026-08-21"
    title: "Say when access is ALLOWED, not only when it is denied"
    context: >
      Measured 2026-08-21: firefox-esr opened the camera twice in one morning
      with no video call — 08:48:56 and 09:14:41 — because web.whatsapp.com had
      held a standing per-origin camera grant since 2026-07-26 and a restored
      tab re-acquires on reload. hwprivacy allowed both CORRECTLY: at each layer
      the question asked was "is this firefox-esr?", and it was. And it said
      nothing at all. The deny path had a notification and a history row; the
      allow path had neither.
    decision: >
      Notify on allowed access, and give the persistent table an `allowed`
      column beside `denied`. A tool whose job is telling you when your camera
      turns on cannot only tell you when it doesn't.
    gate:
      where: "hwprivacy-daemon/src/notify_allow.rs — a pure function, deliberately"
      why_pure: >
        Every rule in this project that decided whether a user-visible thing
        happens and lived inline in a tokio::spawn turned out to be wrong AND
        untestable — b1's dismiss handling, the C5 burst arithmetic. This one
        takes values and returns a bool.
      conditions: "notify_on_allow, real access (pid != 0), past the startup grace, outside the per-(app,device) cooldown"
    why_a_startup_grace_and_not_an_allowlist:
      what: "wireplumber opens the camera about eight seconds after the daemon starts, at every boot; v4l_id before that."
      rejected: >
        "Only notify for executables that have a rule" — my first idea, and it
        does not even work: wireplumber HAS a rule in the live config. Naming
        system processes would also be exactly the per-application coupling
        ruled out by d-executable-is-the-principal.
      chosen: "A time window. App-agnostic, covers anything that probes at boot."
      accepted_cost: "a genuine access in the first minute after login is silent."
    why_a_cooldown_and_not_once_per_session: >
      The 08:48 and 09:14 opens were two separate things Costin did not know
      about, 26 minutes apart. Both deserve saying. Five minutes collapses one
      burst into one notification without hiding a later return.
    the_kernel_layer_reports_camera_only:
      what: "An allowed MIC event from the kernel is never announced."
      why: >
        The kernel sees /usr/bin/pipewire holding /dev/snd on behalf of
        everyone. "pipewire used the microphone" is useless, and the PipeWire
        layer announces the same act with the REAL app name — so allowing MIC
        through both would give two notifications for one access. Each layer
        speaks only about what it can actually see.
    wording_is_past_tense: >
      "used the camera", never "is using". The LSM hook is on open() and nothing
      fires on close, so hwprivacy does not know when access ends. Same limit
      that rules out a tray in-use dot: it would light and never go out.
    urgency: "Normal, not Critical. A denial is an alarm; this is a fact."

  - id: d-history-table
    date: "2026-08-21"
    title: "`offenders` becomes `history`, and gains an allowed column"
    supersedes_naming_in: fail2ban_shaped_reporting
    decision: "hwprivacy-ctl offenders -> history; Offender -> HistoryEntry; GetOffenders -> GetHistory; offenders.json -> history.json."
    why: >
      Once the table records allowed access the name is a lie — and it was
      already wrong for the discovery-loop rows, where "signal-desktop denied
      the camera 12 times" means add an exe_path, not that Signal is hostile.
      Renamed BEFORE publication because it is a user-facing command.
    migration_is_the_risky_part: >
      The live table held 115 denials accumulated since 2026-08-19 — 42 for
      firefox-bin, 18 for python3.13 — and that data exists nowhere else: the
      event log is a 500-entry ring that dies with the daemon, and the journal
      rotates. load_with_legacy() reads offenders.json when history.json is
      absent, writes the new file immediately, and LEAVES THE OLD ONE in place
      so a bad migration is recoverable. Verified live: 10 rows, 115 denials,
      all present after the rename.
    sort_order: "denied desc, then allowed desc. Denials stay the alarming column."
    the_ctl_footer_says_so_outright: >
      A column headed ALLOWED next to one headed DENIED reads like a scoreboard
      of things that went wrong. It is the opposite, and the footer says it
      plainly rather than leaving the reader to infer it.

  - id: d-prompts-are-todo-items
    date: "2026-08-23"
    title: "A permission prompt stays until answered; only one per (app, device)"
    resolves: "ROADMAP b6_resident_prompt_never_times_out"
    context: >
      Found live on 2026-08-21 while verifying b1. notification.rs set BOTH
      Hint::Resident(true) and timeout(60000). Resident wins, so the popup never
      expired, wait_for_action never returned, the dismiss cooldown never
      started, and every new stream from the same app stacked another identical
      popup. Nothing was written — b1's fix held — but "ask again later" simply
      did not happen.
    decision: >
      Costin, 2026-08-23: "stays until answered. after answer the behaviour it
      will follow the answer." The persistence is the feature; the stacking is
      the defect.
    consequences:
      - "timeout(60000) -> Timeout::Never. Saying it out loud is what makes the code downstream honest."
      - "One pending prompt per (app, device), keyed on the normalised name so `Firefox` and `Firefox [pipewire-pulse]` are one question."
      - "A second stream while a prompt is pending is BLOCKED and logged, silently. The access is refused either way; the user is simply not asked twice."
      - "The claim must be released on every exit path. A leak means that (app, device) is never asked about again for the life of the daemon — silent, total, and invisible in the log."
    why_not_auto_expire: >
      The alternative was dropping Resident so the 60s timer worked. Rejected:
      with a plain `ask` rule the application may never retry, so a popup that
      vanished while the user was away would leave the app broken with no
      explanation and no second chance. Android's model — the question waits —
      is the right one for a permission manager.
    the_cooldown_survives: >
      d-dismiss-saves-nothing is unchanged and is now actually reachable.
      Actively closing a popup still means block, save nothing, cool down, ask
      again. It was never wrong; the only route to it was a timeout that never
      fired.

  - id: d-presets-are-data
    date: "2026-08-23"
    title: "Rule sets are importable data files, never code"
    context: >
      A rule that grants the camera at the kernel layer needs an exe_path, and
      SetRule over D-Bus cannot carry one — so the only way to allowlist a
      binary was to stop the daemon and hand-edit a file it rewrites wholesale.
      Separately, a fresh install has no camera at all, because /usr/bin/pipewire
      is denied /dev/video0 and PipeWire therefore creates no camera node.
      Costin, 2026-08-21: "yes. both. and better - proposed optional config list
      to be imported somehow."
    decision: >
      TOML presets in ~/.config/hwprivacy/presets (user) and
      /usr/share/hwprivacy/presets (shipped), user shadowing system by name.
      The MECHANISM is generic; the CONTENT is data. A third party contributes a
      file, never a patch — which is the only shape compatible with
      d-executable-is-the-principal.
    the_baseline_is_just_a_preset: >
      `hwprivacy-daemon install` imports desktop-baseline rather than carrying
      hardcoded rules. Config::default() stays empty, so every test that asserts
      on an empty config keeps meaning what it meant.
    safety_properties:
      candidate_lists: "each entry names several paths; the first that EXISTS wins and the report says which. /usr/lib/firefox-esr/firefox-esr is Debian's path — one hardcoded path would be wrong everywhere else."
      never_widen: "if a rule for that app exists, the entry is skipped ENTIRELY. Not merged, and above all not given an exe_path — adding a path to an existing `camera = allow` would grant kernel access nobody asked for."
      rechecked_at_apply: "the existence check runs again when applying, not only when planning. A preview may be minutes old and the user may have written a rule since."
      no_guessed_camera_grants: "an entry with `camera = allow` and no resolvable candidate is SKIPPED, and the report names every path tried. Importing it would create exactly the state kernel_camera_gaps() warns about — reads `allow`, denied by the kernel, looks like a broken allowlist."
      preview_is_the_default: "`preset import X` writes nothing; `--apply` commits. A preset is a GRANT, so the safe outcome is the one you get by forgetting the flag."
    only_verified_paths_are_shipped: >
      Two presets, desktop-baseline and browsers. Every candidate marked as
      known-good was checked on the machine this was written on. Unverified
      candidates for other distributions are listed too, and are safe precisely
      because an unresolvable one is skipped rather than guessed at.
    deliberately_excluded:
      v4l_id: >
        Denied at every boot and it is udev's camera-capability probe. Whether
        that denial breaks anything is UNKNOWN, and granting on a hunch is the
        wrong direction. Left as an open question.
      xdg_desktop_portal: >
        Not included: the portal delegates to PipeWire, and it is `pipewire`
        that opens the device. No evidence the portal binary opens /dev/video*
        itself, so no grant.

  - id: d-a-rule-has-no-opinion-by-default
    date: "2026-08-23"
    title: "A rule's categories are optional; setting one writes only that one"
    supersedes_behaviour_of: "Config::set_rule, which filled all three categories with Deny"
    context: >
      Measured live 2026-08-23. Costin deleted every rule, then granted firefox
      the camera through hwprivacy-ctl. Three things went wrong at once and all
      three were the same shape — the tool writing or reporting an opinion
      nobody expressed. AppRule carried three non-optional Permission fields
      defaulting to Deny, so the grant also wrote `microphone = "deny"` and
      `monitor = "deny"`. With default_action = "ask", that silently downgraded
      the microphone from a prompt to a hard deny. GetRules then flattened each
      rule into three D-Bus rows, so one rule rendered as three in every
      frontend and there was nowhere to report exe_path.
    decision: >
      microphone/camera/monitor become Option<Permission>. None means "this rule
      has no opinion", and the category falls through to default_action exactly
      as an unruled app does. set_rule writes one category; the other two stay
      absent. Frontends render an unset category as "—", never as "deny".
    migration: >
      None, deliberately. An existing `microphone = "deny"` deserialises to
      Some(Deny) and stays a deny. A bare deny written by the old code cannot be
      told apart from a deliberate one, and loosening it on load would relax a
      rule the user may have meant, without asking. Costin chose this over
      stripping them, 2026-08-23.
    consequences:
      - "serde skip_serializing_if keeps unset categories out of the file — which matters because the daemon rewrites config.toml wholesale on every rule change."
      - "AppRule::get_permission returns Option; Config::get_permission resolves it. The two questions — what did the user write, and what happens now — stop being the same call."
      - "GetRules returns one row per rule: (app, mic, camera, monitor, exe_path, gap_note)."
      - "A preset still states all three categories and is still written as Some(_). A preset is a rule set, not a single-category grant."

  - id: d-camera-grants-need-a-binary-and-say-so
    date: "2026-08-23"
    title: "exe_path is writable from the frontends, and a rule that cannot reach a layer announces it"
    context: >
      kernel_camera_allowlist() keys purely on exe_path and never looks at
      app_name, but nothing outside a preset could write one: ctl rules set,
      the GUI form and D-Bus SetRule all carried three fields. So no string a
      user could type would ever grant a camera to a non-sandboxed application,
      and the only route was hand-editing config.toml with the daemon stopped.
      Measured 2026-08-23 — `Rule set: firefox → camera = allow` at 16:05:23,
      `Kernel layer DENIED firefox-esr` at 16:05:36, nothing said in between,
      while `hwprivacy-ctl rules list` reported `camera allow`. The warning
      already existed in kernel_camera_gaps() but ran only at connect time, and
      the recheck loop could not fire it either: a rule with no exe_path
      contributes no allowlist entry, so PolicyFingerprint never changed.
    decision: >
      Costin, 2026-08-23, chose the denial list over a manual path field. The
      kernel already logged the exact executable when it denied it, so that
      history IS the picker. `hwprivacy-ctl rules denied-cameras` lists them and
      `rules allow-camera <path> [--as <app>]` grants one; the GUI shows the
      same list with an Allow button. Gaps are reported as a notification at the
      moment the rule is saved AND annotated in rules list / status.
    the_two_identities: >
      The reason a single text field could never work. The PipeWire layer keys
      on a name the application declares about itself ("firefox"); the kernel
      layer keys on an executable (/usr/lib/firefox-esr/firefox-esr, short name
      "firefox-esr"). --as, and the GUI's rule dropdown, let one rule carry both
      instead of leaving two rules for one application.
    consequences:
      - "New D-Bus: SetRuleExe(app, path) and AllowCamera(app, path). AllowCamera is atomic because the halfway state is exactly what warns — two calls made a successful grant announce a failure it was one call away from fixing, and a refused path rolls the rule back."
      - "set_rule_exe refuses a relative path, a path that does not exist, and an unknown app — the b4 precedent: refuse rather than store something that can never work."
      - "A `camera = allow` with NO exe_path is still legal and is never refused. It is the correct rule for a portal/Flatpak app that takes the camera through PipeWire. It warns; it is not blocked."
      - "gap_delta() reports only what CHANGED. exe_recheck_secs fires every 30s; a warning printed 2880 times a day is one nobody reads."
      - "default_action = allow is a GLOBAL camera gap — every unruled app is allowed at layer 1 and denied at layer 2, which has no executable for it. Reported once at startup, not once per rule."
    not_done: >
      Pre-authorising a binary that has never been denied still needs a preset
      or a hand-edit — a consequence of choosing the denial list over a manual
      path field. presets/browsers.toml already covers Firefox and Chrome.

  - id: d-one-device-one-prompt
    date: "2026-08-23"
    title: "One device, one application, one prompt — no channel ordinals"
    supersedes: ["d-per-microphone-identity", "d-coalesce-by-category"]
    context: >
      b3 was "two identical microphone prompts". The fix taken on 2026-08-19
      assumed the two links were two physical microphones and labelled them
      `mic1`/`mic2`, deliberately exempting the microphone from the coalescing
      the monitor already got. Four days of use showed the premise was wrong
      three separate ways.

      First, the hardware. `alsa_input.pci-0000_00_1f.3.analog-stereo` is ONE
      device exposing `capture_FL` and `capture_FR` — two channels, exactly the
      shape of a sink's `monitor_FL`/`monitor_FR`, which was always coalesced.
      Read out of pw-dump 2026-08-23: the machine has exactly one Audio/Source.

      Second, the code could not have done what the ADR claimed. device_instance()
      filtered sibling ports by node_id, so two PHYSICAL microphones — separate
      nodes, separate ProtectedDevices, separate rows in `hwprivacy-ctl devices`
      — could never reach it. The only thing it could ever label was channels.

      Third, and worst, the exemption broke the microphone outright. Two links
      in one batch are two decisions; the first claims the (app, device) prompt
      slot and the second hits the b6 guard and is denied. Measured repeatedly
      on 2026-08-23: `mic1 ASKED` then `mic2 DENIED`, 60 ms apart, on every
      single attempt. A stereo microphone was guaranteed to lose a channel.
    decision: >
      Costin, 2026-08-23: "no more mic1 or mic2 or mic left or mic right. just
      mic — the device. remove all the other. maybe other people does not have a
      mic with 2 channels." device_instance() is deleted, LinkMatch::instance and
      AccessEvent::device_instance are deleted, device_label_for() is deleted,
      and group_links() coalesces by (category, device node, stream node) for
      ALL categories rather than exempting the microphone.
    consequences:
      - "One prompt per (device, application), whatever the channel count. The camera arrives as a single link and is unaffected."
      - "The group still carries EVERY link id. Coalescing the prompt must never coalesce the teardown, or a channel keeps flowing while the popup says BLOCKED."
      - "Two REAL microphones stay two prompts — they are different node_names and grouping already keys on that. This is what the ordinal was reaching for and could never express."
      - "Prompts stop promising precision the rules cannot deliver: permissions are per category, so `Microphone (mic1)` was decorating a button that wrote `microphone = allow` for every channel."
      - "History rows and the event log lose the `(mic1)` suffix. AccessEvent::device_display() now returns the bare category."
    per_device_rules_are_still_not_a_thing: >
      Unchanged and still out of scope. If per-device rules are ever wanted, the
      key is the device NODE NAME — which is stable, already carried, and
      already what grouping uses — never a port ordinal.

  - id: d-no-per-stream-grants
    date: "2026-08-23"
    title: "`ask_each` and the whole per-stream concept are removed"
    supersedes: ["d-per-stream-gating"]
    context: >
      `ask_each` promised a prompt per PipeWire stream — per browser tab, in
      effect — and could not deliver one. Costin tested it end to end on
      2026-08-23 and reported "i feel that i have almost no control over
      streams". The journal shows why, twice in ninety seconds:

        17:59:49  link 96 destroyed  -> microphone ASKED
        17:59:55  microphone STREAM_ALLOWED     <- answered Allow
        18:00:28  link 109 destroyed -> microphone ASKED   <- asked again
        18:00:31  microphone STREAM_ALLOWED     <- answered Allow

      Two independent reasons, both structural. The link is destroyed BEFORE the
      user is asked (correct — security first), and link_manager has only
      destroy_link/destroy_links/destroy_all_links_to_node: nothing in the tree
      can create a link, so answering "allow" had nothing to reattach. And the
      grant was keyed on a PipeWire node id, which prune_one_shot drops as soon
      as the torn-down stream leaves the graph — so even a retry found nothing.
    decision: >
      Costin, 2026-08-23: "no more ask_each." Permission::AskEach,
      PolicyDecision::AskEachStream, the one_shot_allowed map with
      grant_one_shot/is_one_shot_allowed/prune_one_shot, PromptAction's
      GrantThisStream/DenyThisStream, AccessAction's StreamAllowed/StreamDenied,
      the AllowStream/DenyStream D-Bus methods and the two per-stream
      notification buttons are all deleted. Four permissions remain in the enum,
      three of them offered on a prompt: allow, while_in_use, deny.
    compatibility: >
      The STRING `ask_each` still parses, to `ask`. Existing configs and the
      shipped browsers preset contain it, and a hard parse error would stop the
      daemon starting on an install that was working yesterday. `ask` is the
      honest survivor: the user wanted to be asked, and that is the remaining
      way to be asked. It is accepted but no longer OFFERED — the FromStr error
      message no longer lists it. Two tests cover the alias, one through serde
      and one through the CLI parser.
    what_this_costs: >
      Per-tab microphone control, which never worked. A browser is now one
      decision for the whole application, which is what
      d-executable-is-the-principal already said about the camera.
    it_also_undermines_while_in_use: >
      This removed the only grant machinery that could have made `while_in_use`
      distinguishable from `allow`. That permission was ALREADY not implemented
      — while_in_use_streams is written and never read — and is now harder to
      implement rather than easier. See ROADMAP blockers
      while_in_use_is_not_implemented; Costin asked to keep it pending a
      decision.

  - id: d-while-in-use-is-a-session
    date: "2026-08-23"
    title: "`while_in_use` is a grant bounded by one device session"
    context: >
      Costin asked directly whether `while_in_use` was implemented. It was not,
      and had never been: `StreamTracker::while_in_use_streams` was written by
      track_while_in_use() and READ NOWHERE; AccessAction::RevokedOnDisconnect
      was declared and EMITTED NOWHERE; policy_engine::evaluate mapped
      WhileInUse straight to Allow under a comment claiming it tracked the
      client lifecycle. It was a synonym for `allow` presented in the UI as the
      narrower choice — the lying-surface class removed everywhere else that
      day. evaluate() had no tests at all, which is why it survived.
    the_correction_that_unblocked_it: >
      Every doc, and the notification body text itself, asserted "hwprivacy
      cannot tell when access ends". That is false, and nobody had checked.
      Layer 1 has always seen the end — main.rs diffs live link ids against
      tracked connections every poll and prunes the stale ones; a vanishing link
      IS the release. And for layer 2, `bpf_lsm_file_release` and
      `bpf_lsm_file_free_security` are both present in Debian 13's BTF
      (verified 2026-08-23), so the kernel could tell us too. The limitation was
      an unattached hook, not the platform.
    decision: >
      Costin, 2026-08-23: the grant "stays ONLY [while] that device is started
      until is closed", and at session end the next open ASKS again. Layer 1
      first; the camera refuses `while_in_use` at write time rather than
      accepting a rule it cannot honour.
    how_it_works:
      grant: "no session -> AskUser. The prompt IS how a session begins; answering while_in_use opens it immediately."
      live: "a session is live while the app holds a link to that device, OR while the settle window since the grant has not elapsed."
      end: "expire_sessions() runs each poll AFTER stale links are pruned, drops every session whose device was released, and logs AccessAction::SessionEnded — the first END-of-access event this project has had."
      key: "(normalised app, device category). NOT a node id: that is precisely what pruned the old per-stream grants before they could be used."
    the_settle_window: >
      `policy.while_in_use_settle_secs`, default 10. Not a convenience and not
      the "reopen grace" that was considered and rejected. Enforcement destroys
      the link BEFORE the prompt is shown, so between the user's answer and the
      application's reconnect there are legitimately zero links; without a
      window the session would end in that gap and prompt again on a loop. That
      is exactly how `ask_each` failed (`d-no-per-stream-grants`). It is also
      the only period in which a released device is still granted, so it is kept
      short and is a config knob rather than a constant.
    why_the_camera_is_refused: >
      The camera is taken through V4L2 directly and is enforced by the LSM
      program, which is attached to `lsm/file_open` only. It never observes the
      release, so it could not end the session and the rule would silently
      behave as `allow` — the defect being fixed. set_rule() returns false, the
      CLI prints why, and the prompt does not OFFER the button for a camera.
      This is "not built yet", not "cannot be built": the hook exists.
    consequences:
      - "evaluate() takes a `session_live` flag. State stays in the caller so the function remains pure and every branch is testable — it had zero tests before this."
      - "AccessAction::SessionEnded added; RevokedOnDisconnect is still unused and still emitted nowhere."
      - "'hwprivacy cannot tell when access ends' was removed from the layer-1 notification and narrowed to the kernel layer everywhere else."
    next: >
      Attach a second BPF program to lsm/file_release, match the same device
      inodes, and the camera can have sessions too. ROADMAP > next_up.

  - id: d-camera-sessions-via-file-release
    date: "2026-08-23"
    title: "The kernel layer observes releases, so the camera can have sessions"
    extends: d-while-in-use-is-a-session
    context: >
      `while_in_use` landed for layer 1 only, and the camera refused it, because
      the LSM program was attached to `lsm/file_open` alone and never saw a
      camera being let go. That was never a platform limit: `bpf_lsm_file_release`
      and `bpf_lsm_file_free_security` are both in Debian 13's BTF. Nothing was
      attached, and every doc in the repo repeated "hwprivacy cannot tell when
      access ends" as though it were a fact about the kernel.
    decision: >
      A second BPF program on `lsm/file_release`. The camera now accepts
      `while_in_use`, and the session is enforced by ADDING the executable to
      the kernel allowlist while it is live and REMOVING it when the device is
      released. There is no way to hold an open() pending a human — the hook
      answers in nanoseconds — so presence in the allowlist IS the grant.
    why_the_file_pointer_is_the_key: >
      `security_file_release` runs in whatever context drops the fd, and
      `__fput` can be deferred to a kworker entirely. Reading `current` there
      would attribute a close to the wrong task or to none. A (file -> executable)
      map recorded at OPEN time cannot be wrong, whoever does the closing.
    why_a_count: >
      One camera session is 13 opens (measured). A release is emitted only when
      an executable's open count reaches zero, or the session would end while
      the application is still recording.
    the_duplicate_is_deliberate: >
      BPF only returns a value from an atomic under ISA v3, and raising the
      toolchain floor for one instruction was not worth it. The decrement is
      atomic and the zero-check is a separate re-read, so two threads dropping
      the last two handles can both emit. Ending an already-ended session is a
      no-op; MISSING a release leaves the session open forever. Fail toward
      ending.
    the_push_had_to_become_immediate: >
      The allowlist was re-pushed only on the `exe_recheck_secs` tick, default
      30 s. Fine for "a package upgrade changed an inode"; useless for "the user
      clicked Allow and the app is still being denied". `DaemonState` gained a
      `policy_dirty` Notify, raised on every rule write and every session
      change, and the lsm_client session loop selects on it. This also makes
      `rules allow-camera` take effect at once rather than within 30 s.
    a_camera_session_needs_a_binary: >
      Refused at write time without one. Unlike a plain `camera = allow`, which
      is meaningful for a portal app on the PipeWire route, a while_in_use
      camera rule with no exe_path has nothing to add to the allowlist and could
      do nothing at all.
    verified_2026_09_01: >
      The BPF VERIFIER ACCEPTED the program. The helper carrying both
      lsm/file_open and lsm/file_release was installed to /usr/bin and
      hwprivacy-lsm.service came up active, enforcing. This ADR's "not verified
      yet" is retired. What the same session then found is that acceptance was
      never the blocker — see d-camera-sessions-cannot-be-started, which
      SUPERSEDES the half of this ADR that let a camera take `while_in_use`.
    superseded_in_part_by: d-camera-sessions-cannot-be-started

  - id: d-camera-sessions-cannot-be-started
    date: "2026-09-01"
    title: "while_in_use is microphone and monitor only; the camera refuses it"
    supersedes_part_of: d-camera-sessions-via-file-release
    context: >
      d-camera-sessions-via-file-release solved how a camera session ENDS. It
      did not ask how one BEGINS, and the answer is that nothing can begin one
      for the applications layer 2 exists to guard.
    measured_live: |
      18:53:09  Rule set: firefox -> cam = while_in_use   (allowlist 3 -> 2)
      18:53:33  Kernel layer DENIED firefox-esr -> /dev/video0
      18:54:15  DENIED again
      18:54:57  DENIED again ... permanently, with no way to answer
    the_deadlock: >
      A while_in_use rule with no live session removes the executable from the
      kernel allowlist -- that is exactly what makes it not a synonym for
      `allow`. Firefox then opens /dev/video0 through V4L2, never through
      PipeWire, so no link is created and no PipeWire prompt is raised. The
      denial arrives instead from the kernel, whose notification is
      INFORMATIONAL WITH NO BUTTONS -- deliberately, because the action path
      carries b1. So there is no prompt to answer, no answer to open a session,
      and the camera stays denied forever.
    why_the_file_release_hook_did_not_fix_this: >
      It addressed the other half of the lifecycle. `begin_session()` is reached
      from exactly two places, both on the PipeWire link path in main.rs. An
      app on the V4L2 route reaches neither. Ending was the visible gap;
      starting was the silent one.
    decision: >
      `set_rule()` refuses `camera = while_in_use` outright, whatever else the
      rule carries. The earlier guard checked only for an exe_path, which was
      necessary and not sufficient -- it is what permitted the deadlock above.
      The microphone and the playback monitor keep while_in_use: both are gated
      by PipeWire, which prompts.
    why_refuse_rather_than_warn: >
      A rule that can never reach a live state is the same lying surface as the
      old `while_in_use == allow`, failing closed instead of open. Worse, in
      this direction it costs the user their camera mid-call.
    the_message_had_to_change_too: >
      The CLI previously said "attach a binary and retry". That retry is now
      refused as well, so the message prescribed a command guaranteed to fail.
      It now names the reason and points at allow/deny, and says which devices
      DO support while_in_use.
    what_would_reopen_this: >
      A camera denial that can raise an ACTIONABLE notification. That requires
      b1 to be fixed first -- routing a new event source into the action path
      before then inherits the bug on day one, which is the standing rule. If
      that lands, delete the guard in config.rs::set_rule and this ADR with it.
    also_corrected: >
      notification.rs withheld the While in Use button for cameras already, but
      its comment gave the OBSOLETE reason ("the kernel never observes a
      release"), untrue since 2026-08-23. Left alone, the next reader would have
      restored the button on a dead rationale.

  - id: d-a-session-must-be-visible
    date: "2026-09-01"
    title: "A live session is shown in status, or the feature cannot be checked"
    context: >
      Until now the only evidence a while_in_use session was open was the kernel
      allowlist COUNT moving -- a number that also moves when a rule changes or
      a binary is replaced. An ambiguous signal is why while_in_use went months
      being believed rather than checked, and why it turned out to be a synonym
      for `allow`.
    decision: >
      D-Bus `GetSessions` -> (app, device, age_secs), rendered by
      `hwprivacy-ctl status` as a `Live sessions` block. Additive, like
      GetHistory: GetKernelStatus keeps its tuple so the TUI and GUI stay
      working untouched.
    printed_only_when_non_empty: >
      A permanent "Sessions: 0" line teaches the reader to skip the row, and
      this row exists to be noticed.
    one_liveness_rule: >
      `live_sessions()` and `session_live()` share the predicate, so what the
      status prints and what the kernel allowlist contains cannot disagree. A
      readout that says "open" after the grant was withdrawn would be worse than
      printing nothing.
    verified_live_2026_09_01: |
      Live sessions (while_in_use — access ends when the device is released)
        parecord             microphone   open 8s
      12s later: block absent, GetSessions empty, SESSION_ENDED logged.
    the_first_full_lifecycle: |
      Firefox video call, the same evening -- ask, grant, use, release, end:
      19:06:46  Firefox [pipewire-pulse] -> microphone -> ASKED
      19:06:50  User set rule: Firefox -> Microphone = while_in_use
      19:07:00  while_in_use session ended: firefox released Microphone
      19:07:00  Event: firefox (pid:0) -> microphone -> SESSION_ENDED

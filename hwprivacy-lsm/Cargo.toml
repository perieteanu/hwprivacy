[package]
name = "hwprivacy-lsm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Kernel-level camera access enforcement for hwprivacy, via eBPF LSM"

# NOTE: building this crate requires the eBPF toolchain (clang, libbpf-dev,
# bpftool) and a generated src/bpf/vmlinux.h. Since it is now a workspace
# member, `cargo build --workspace` — which also builds the daemon running as a
# service — will fail without them. build.rs says so explicitly; the fix is
# ~/projects/claude-run/hwprivacy-ebpf-toolchain-20260804.sh
[[bin]]
name = "hwprivacy-lsm"
path = "src/main.rs"

[dependencies]
hwprivacy-proto = { path = "../hwprivacy-proto" }
serde_json = { workspace = true }
libbpf-rs = "0.27"          # MSRV 1.82; local rustc is 1.85
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
libc = "0.2"

[build-dependencies]
libbpf-cargo = "0.27"

name: CI

# Runs the same gate as `make check`: the doc-check contradiction detector,
# then the test suite. Split into two jobs on purpose — see below.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Every action is pinned to a COMMIT SHA, not a tag. `@v5` and `@v2` are tags
# and `@stable` is a branch — all three are mutable, so any of them can start
# executing different code without a commit here. The trailing comment records
# which release each SHA is, since a SHA alone is unreadable. This repo has no
# Actions secrets and its workflow token is read-only, so the exposure was
# small; it is pinned anyway because a security tool should not ship a CI
# supply chain looser than the thing it enforces.
#
# To bump one: read the upstream release notes, resolve the new tag with
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
# and update the SHA and its comment together.

jobs:
  # doc-check reads FILES only: no kernel, no toolchain, no display. It is the
  # cheapest signal in the repo and catches the failure this project actually
  # has — documentation drifting away from the code — so it runs on its own and
  # is never masked by a build problem elsewhere.
  doc-check:
    name: docs match the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: make doc-check
        run: make doc-check

  test:
    name: build and test (rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.85.0 is the contract: it is what Debian 13 ships, it is the reason
        # notify-rust is pinned to =4.11.3, and it is the only compiler this
        # project is claimed to build on. `stable` is early warning — with
        # --locked freezing the dependency graph, a stable-only failure is a
        # real regression, not dependency drift.
        rust: ["1.85.0", "stable"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      # GTK4 for the GUI crate; clang/libbpf for the eBPF skeleton.
      #
      # bpftool needs care. There is no standalone `bpftool` package on Ubuntu:
      # the name is VIRTUAL, provided by linux-tools-common, which ships no
      # binary of its own. What linux-tools-common does ship is /usr/sbin/bpftool,
      # a wrapper that dispatches on `uname -r` — and hosted runners run an Azure
      # kernel (6.17.0-*-azure) whose linux-tools package does not exist, so that
      # wrapper resolves to nothing. That is the stub, and it is why every earlier
      # attempt here found no bpftool.
      #
      # linux-tools-generic is a different thing: it depends on the GENERIC
      # flavour's tools (linux-tools-6.8.0-*-generic on noble), which is a real
      # package containing a real binary under /usr/lib/linux-tools/<ver>/. That
      # binary is called directly below, never through the wrapper. It does not
      # need to match the running kernel — it reads /sys/kernel/btf/vmlinux as a
      # data file, it does not load anything.
      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libdbus-1-dev pkg-config \
            clang libbpf-dev linux-tools-generic

      # vmlinux.h is generated from the RUNNING kernel's BTF and is not
      # committed, because it describes the kernel it was built against. The
      # runner's kernel is not Debian 13's, which is exactly why this is
      # generated here rather than shipped.
      #
      # There is no fallback, deliberately. pahole (dwarves) was tried and
      # measured: `pahole --compile /sys/kernel/btf/vmlinux` exits 0 and emits
      # 156k plausible lines that do NOT compile — it drops the anonymous enums
      # bpf_helpers.h needs (BPF_ANY, BPF_NOEXIST) and redefines va_list against
      # clang's own. A fallback that silently produces a broken header turns a
      # missing-tool failure into a Rust build panic two minutes downstream,
      # which is how this workflow stayed red.
      - name: generate vmlinux.h from the runner's kernel BTF
        run: |
          set -euo pipefail
          OUT=hwprivacy-lsm/src/bpf/vmlinux.h
          BPFTOOL=$(ls -1 /usr/lib/linux-tools/*/bpftool 2>/dev/null | sort -V | tail -1)
          if [ -z "$BPFTOOL" ]; then
            echo "no bpftool under /usr/lib/linux-tools — linux-tools-generic shipped none"
            ls -la /usr/lib/linux-tools/ 2>&1 || true
            exit 1
          fi
          echo "using $BPFTOOL"
          "$BPFTOOL" version
          "$BPFTOOL" btf dump file /sys/kernel/btf/vmlinux format c > "$OUT"
          wc -l "$OUT"

      # Prove the header we just generated is usable, HERE, rather than letting
      # cargo discover it inside build.rs where the error reads as a Rust
      # problem. One second, and it fails in the step that caused it.
      - name: the generated header must actually compile
        run: |
          set -euo pipefail
          clang -g -O2 -target bpf -D__TARGET_ARCH_x86 \
            -I hwprivacy-lsm/src/bpf \
            -c hwprivacy-lsm/src/bpf/devices.bpf.c \
            -o "$RUNNER_TEMP/devices.bpf.o"
          ls -l "$RUNNER_TEMP/devices.bpf.o"

      # rustfmt, and it is not what it looks like. libbpf-cargo runs rustfmt
      # over the generated skeleton as a COSMETIC pass, and handles it being
      # absent — libbpf-cargo/src/gen/mod.rs treats ErrorKind::NotFound as
      # "skip formatting". That is why a Debian box with no rustfmt at all
      # builds this fine.
      #
      # What it does NOT handle is a rustfmt that exists and FAILS: that path
      # hits ensure!(output.status.success()) and kills the build. Under rustup
      # `rustfmt` is always on PATH as a shim, and the shim exits non-zero when
      # the component is missing. So the broken tool is worse than no tool, and
      # only the rustup case is affected.
      #
      # The `stable` leg masked this — the runner image ships a preinstalled
      # stable toolchain that already carries the component. A pinned version
      # gets a minimal profile and does not.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch, 2026-09-03
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: cargo build
        run: cargo build --workspace --locked

      # The suite is pure unit tests — no daemon, no D-Bus, no hardware. What
      # it does NOT cover is stated plainly rather than implied: enforcement is
      # verified against a live kernel by tools/acceptance/, which cannot run
      # on a hosted runner because it needs root and a real capture device.
      - name: cargo test
        run: cargo test --workspace --locked

name: CI

# Runs the same gate as `make check`: the doc-check contradiction detector,
# then the test suite. Split into two jobs on purpose — see below.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Every action is pinned to a COMMIT SHA, not a tag. `@v5` and `@v2` are tags
# and `@stable` is a branch — all three are mutable, so any of them can start
# executing different code without a commit here. The trailing comment records
# which release each SHA is, since a SHA alone is unreadable. This repo has no
# Actions secrets and its workflow token is read-only, so the exposure was
# small; it is pinned anyway because a security tool should not ship a CI
# supply chain looser than the thing it enforces.
#
# To bump one: read the upstream release notes, resolve the new tag with
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
# and update the SHA and its comment together.

jobs:
  # doc-check reads FILES only: no kernel, no toolchain, no display. It is the
  # cheapest signal in the repo and catches the failure this project actually
  # has — documentation drifting away from the code — so it runs on its own and
  # is never masked by a build problem elsewhere.
  doc-check:
    name: docs match the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: make doc-check
        run: make doc-check

  test:
    name: build and test (rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.85.0 is the contract: it is what Debian 13 ships, it is the reason
        # notify-rust is pinned to =4.11.3, and it is the only compiler this
        # project is claimed to build on. `stable` is early warning — with
        # --locked freezing the dependency graph, a stable-only failure is a
        # real regression, not dependency drift.
        rust: ["1.85.0", "stable"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: ./.github/actions/bpf-toolchain

      # rustfmt, and it is not what it looks like. libbpf-cargo runs rustfmt
      # over the generated skeleton as a COSMETIC pass, and handles it being
      # absent — libbpf-cargo/src/gen/mod.rs treats ErrorKind::NotFound as
      # "skip formatting". That is why a Debian box with no rustfmt at all
      # builds this fine.
      #
      # What it does NOT handle is a rustfmt that exists and FAILS: that path
      # hits ensure!(output.status.success()) and kills the build. Under rustup
      # `rustfmt` is always on PATH as a shim, and the shim exits non-zero when
      # the component is missing. So the broken tool is worse than no tool, and
      # only the rustup case is affected.
      #
      # The `stable` leg masked this — the runner image ships a preinstalled
      # stable toolchain that already carries the component. A pinned version
      # gets a minimal profile and does not.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch, 2026-09-03
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: cargo build
        run: cargo build --workspace --locked

      # The suite is pure unit tests — no daemon, no D-Bus, no hardware. What
      # it does NOT cover is stated plainly rather than implied: enforcement is
      # verified against a live kernel by tools/acceptance/, which cannot run
      # on a hosted runner because it needs root and a real capture device.
      - name: cargo test
        run: cargo test --workspace --locked

  # Prove `make install` actually installs. It had NEVER BEEN RUN — not here,
  # not in a container, not on the developer's machine, which got its working
  # install by accretion over months rather than by executing the target. A
  # hosted runner is a clean stranger's machine, and staging into a DESTDIR
  # needs no root, no reboot and no hardware.
  #
  # What this does NOT cover, stated rather than implied: enabling `bpf` in the
  # kernel's LSM list, a reboot, the service attaching, or a real camera. Those
  # need a machine you can reboot, and no hosted runner is one.
  install:
    name: make install installs what it declares
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: ./.github/actions/bpf-toolchain

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch, 2026-09-03
        with:
          toolchain: "1.85.0"
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      # The install targets copy out of target/release/, so this cannot ride
      # along on the debug build the test matrix does.
      - name: cargo build --release
        run: cargo build --release --workspace --locked

      # install-lsm is deliberately separate from install — it runs as root and
      # denies the camera by default, so it is never pulled in silently. Both
      # are staged here because both are what a packager would call.
      - name: stage the install
        run: |
          set -euo pipefail
          make install DESTDIR="$RUNNER_TEMP/stage"
          make install-lsm DESTDIR="$RUNNER_TEMP/stage"

      - name: the staged tree must match debian/*.install
        run: tools/install-check --destdir "$RUNNER_TEMP/stage"

      # Print it so a human can eyeball what a user would actually get.
      - name: what was installed
        run: find "$RUNNER_TEMP/stage" -type f | sed "s|$RUNNER_TEMP/stage||" | sort


name: bpf toolchain
description: >
  Install the GTK and eBPF build dependencies, generate vmlinux.h from the
  runner's kernel BTF, and prove the generated header actually compiles.
  Extracted so the build job and the install job cannot drift apart — two
  copies of this that were supposed to agree is exactly how this repo has
  been bitten before.

runs:
  using: composite
  steps:
    # GTK4 for the GUI crate; clang/libbpf for the eBPF skeleton.
    #
    # bpftool needs care. There is no standalone `bpftool` package on Ubuntu:
    # the name is VIRTUAL, provided by linux-tools-common, which ships no
    # binary of its own. What linux-tools-common does ship is /usr/sbin/bpftool,
    # a wrapper that dispatches on `uname -r` — and hosted runners run an Azure
    # kernel (6.17.0-*-azure) whose linux-tools package does not exist, so that
    # wrapper resolves to nothing. That is the stub, and it is why every earlier
    # attempt here found no bpftool.
    #
    # linux-tools-generic is a different thing: it depends on the GENERIC
    # flavour's tools (linux-tools-6.8.0-*-generic on noble), which is a real
    # package containing a real binary under /usr/lib/linux-tools/<ver>/. That
    # binary is called directly below, never through the wrapper. It does not
    # need to match the running kernel — it reads /sys/kernel/btf/vmlinux as a
    # data file, it does not load anything.
    - name: install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgtk-4-dev libdbus-1-dev pkg-config \
          clang libbpf-dev linux-tools-generic

    # vmlinux.h is generated from the RUNNING kernel's BTF and is not
    # committed, because it describes the kernel it was built against. The
    # runner's kernel is not Debian 13's, which is exactly why this is
    # generated here rather than shipped.
    #
    # There is no fallback, deliberately. pahole (dwarves) was tried and
    # measured: `pahole --compile /sys/kernel/btf/vmlinux` exits 0 and emits
    # 156k plausible lines that do NOT compile — it drops the anonymous enums
    # bpf_helpers.h needs (BPF_ANY, BPF_NOEXIST) and redefines va_list against
    # clang's own. A fallback that silently produces a broken header turns a
    # missing-tool failure into a Rust build panic two minutes downstream,
    # which is how this workflow stayed red.
    - name: generate vmlinux.h from the runner's kernel BTF
      shell: bash
      run: |
        set -euo pipefail
        OUT=hwprivacy-lsm/src/bpf/vmlinux.h
        BPFTOOL=$(ls -1 /usr/lib/linux-tools/*/bpftool 2>/dev/null | sort -V | tail -1)
        if [ -z "$BPFTOOL" ]; then
          echo "no bpftool under /usr/lib/linux-tools — linux-tools-generic shipped none"
          ls -la /usr/lib/linux-tools/ 2>&1 || true
          exit 1
        fi
        echo "using $BPFTOOL"
        "$BPFTOOL" version
        "$BPFTOOL" btf dump file /sys/kernel/btf/vmlinux format c > "$OUT"
        wc -l "$OUT"

    # Prove the header we just generated is usable, HERE, rather than letting
    # cargo discover it inside build.rs where the error reads as a Rust
    # problem. One second, and it fails in the step that caused it.
    - name: the generated header must actually compile
      shell: bash
      run: |
        set -euo pipefail
        clang -g -O2 -target bpf -D__TARGET_ARCH_x86 \
          -I hwprivacy-lsm/src/bpf \
          -c hwprivacy-lsm/src/bpf/devices.bpf.c \
          -o "$RUNNER_TEMP/devices.bpf.o"
        ls -l "$RUNNER_TEMP/devices.bpf.o"
